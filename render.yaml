# Render Blueprint — deploys the matching API (server/) as a free web service.
#
# Render auto-detects this file at the repo root. In the dashboard:
#   New → Blueprint → connect this repo → Apply.
# Render reads process.env.PORT itself (do NOT set PORT here); the server binds
# to it in server/index.js. /health returns { ok: true } for the health check.
#
# The free plan spins down after ~15 min idle, so the first request after a lull
# cold-starts (~30–50s). Fine for a demo; the block shows a friendly wait/error.
services:
  - type: web
    name: bmw-matcher-api
    runtime: node
    plan: free
    rootDir: server         # package.json + index.js live here
    buildCommand: npm install # no dependencies, but Render expects a build step
    startCommand: npm start   # → node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Optional shared-password gate for the /api/* surface. Set the value in
      # the Render dashboard (Environment tab) — NEVER commit it here, hence
      # sync:false, which records that the var exists without carrying a value.
      # When set, every /api/* call must send a matching X-Access-Key header
      # (the frontend's login overlay captures it); /health stays open. When
      # unset, the API runs fully open. Rotate by editing this one value in the
      # dashboard: the service restarts and old sessions are re-prompted, with
      # no frontend redeploy needed.
      - key: DEMO_ACCESS_KEY
        sync: false
      # GCSP offer-email landing page (full HTTPS URL of the GCSP static site's offer
      # page). Unset keeps the same-origin /gcsp/offer path used by the local demo.
      - key: GCSP_OFFER_LANDING_URL
        sync: false
