# All deployment settings come from the environment; nothing secret lives here.
quarkus.application.name=gcsp-api
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.test-port=0
quarkus.banner.enabled=false

# SIGTERM waits up to this long for in-flight requests before stopping.
quarkus.shutdown.timeout=${GCSP_SHUTDOWN_TIMEOUT:10s}

# Identity port: "none" refuses every context request; "oidc" validates bearer JWTs (see README).
gcsp.identity.provider=${GCSP_IDENTITY_PROVIDER:none}

# OIDC settings, used only when the provider is oidc. Public data only; no secret is read.
gcsp.oidc.issuer=${GCSP_OIDC_ISSUER:}
gcsp.oidc.jwks-uri=${GCSP_OIDC_JWKS_URI:}
gcsp.oidc.audience=${GCSP_OIDC_AUDIENCE:}
gcsp.oidc.authorized-party=${GCSP_OIDC_AUTHORIZED_PARTY:}
gcsp.oidc.required-scopes=${GCSP_OIDC_REQUIRED_SCOPES:}
gcsp.oidc.role-claim=${GCSP_OIDC_ROLE_CLAIM:realm_access.roles}
gcsp.oidc.accounts=${GCSP_OIDC_ACCOUNTS:}

# Interim environment context (until run state is persisted by later Stories); required for oidc.
gcsp.environment.id=${GCSP_ENVIRONMENT_ID:}
gcsp.environment.run-id=${GCSP_RUN_ID:}
gcsp.environment.policy-version=${GCSP_POLICY_VERSION:}

# Exact-origin CORS for the static Angular host; unset means same-origin only.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${GCSP_ALLOWED_ORIGINS:}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.cors.access-control-allow-credentials=false
quarkus.http.cors.access-control-max-age=10M

%test.quarkus.http.cors.origins=https://frontend.test
