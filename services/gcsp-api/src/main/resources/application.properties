# All deployment settings come from the environment; nothing secret lives here.
quarkus.application.name=gcsp-api
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.test-port=0
quarkus.banner.enabled=false

# SIGTERM waits up to this long for in-flight requests before stopping.
quarkus.shutdown.timeout=${GCSP_SHUTDOWN_TIMEOUT:10s}

# Identity port: "none" refuses every context request; "oidc" validates bearer JWTs (see README).
gcsp.identity.provider=${GCSP_IDENTITY_PROVIDER:none}

# OIDC settings, used only when the provider is oidc. Public data only; no secret is read.
gcsp.oidc.issuer=${GCSP_OIDC_ISSUER:}
gcsp.oidc.jwks-uri=${GCSP_OIDC_JWKS_URI:}
gcsp.oidc.audience=${GCSP_OIDC_AUDIENCE:}
gcsp.oidc.authorized-party=${GCSP_OIDC_AUTHORIZED_PARTY:}
gcsp.oidc.required-scopes=${GCSP_OIDC_REQUIRED_SCOPES:}
gcsp.oidc.role-claim=${GCSP_OIDC_ROLE_CLAIM:realm_access.roles}
gcsp.oidc.accounts=${GCSP_OIDC_ACCOUNTS:}

# Interim environment context (until run state is persisted by later Stories); required for oidc.
gcsp.environment.id=${GCSP_ENVIRONMENT_ID:}
gcsp.environment.run-id=${GCSP_RUN_ID:}
gcsp.environment.policy-version=${GCSP_POLICY_VERSION:}

# Document provider: none (refuses), synthetic (fictional demo evidence) or unsupported; unknown stops startup.
gcsp.documents.provider=${GCSP_DOCUMENTS_PROVIDER:none}

# Appointment provider: none (refuses), synthetic (fictional demo bookings) or live (unsupported); unknown stops startup.
gcsp.appointments.provider=${GCSP_APPOINTMENTS_PROVIDER:none}

# Exact-origin CORS for the static Angular host; unset means same-origin only.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${GCSP_ALLOWED_ORIGINS:}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.cors.access-control-allow-credentials=false
quarkus.http.cors.access-control-max-age=10M

%test.quarkus.http.cors.origins=https://frontend.test

# Persistence is off until GCSP_DATABASE_URL is set: PersistenceConfigSource then activates datasource and Flyway.
gcsp.database.expected-name=${GCSP_EXPECTED_DATABASE:}
gcsp.environment-id=${GCSP_ENVIRONMENT_ID:}
gcsp.reset-allowed=${GCSP_RESET_ALLOWED:false}
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${GCSP_DATABASE_URL:}
quarkus.datasource.username=${GCSP_DATABASE_USER:}
quarkus.datasource.password=${GCSP_DATABASE_PASSWORD:}
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=gcsp_app
quarkus.datasource.jdbc.max-size=${GCSP_DATABASE_POOL_SIZE:10}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=gcsp_app
quarkus.flyway.default-schema=gcsp_app
quarkus.flyway.create-schemas=true
quarkus.flyway.validate-on-migrate=true
# Stories add V<jira>_1 migrations and merge in any order, so a later merge may carry a lower version.
quarkus.flyway.out-of-order=true

# Notifications (FUCQ-469): unset transport keeps mail captured in the outbox; see README.
gcsp.mail.transport=${GCSP_MAIL_TRANSPORT:}
gcsp.mail.public-base-url=${GCSP_PUBLIC_BASE_URL:}
gcsp.mail.brevo.api-key=${GCSP_BREVO_API_KEY:}
gcsp.mail.from=${GCSP_MAIL_FROM:}
gcsp.mail.from-name=${GCSP_MAIL_FROM_NAME:}
gcsp.mail.brevo.endpoint=https://api.brevo.com/v3/smtp/email
gcsp.mail.brevo.timeout=10s
gcsp.notify.drain-interval=${GCSP_NOTIFY_DRAIN_INTERVAL:5s}

# Account port (FUCQ-458): "none" refuses every read; "hr-snapshot" reads a dated HR export file (see README).
gcsp.account.provider=${GCSP_ACCOUNT_PROVIDER:none}
gcsp.account.hr-snapshot.path=${GCSP_ACCOUNT_HR_SNAPSHOT_PATH:}

# Stock supply: "none" leaves every pull unavailable; "tranche-plan" reads a synthetic plan file. Unknown values stop startup.
gcsp.supply.provider=${GCSP_SUPPLY_PROVIDER:none}
gcsp.supply.tranche-plan-file=${GCSP_SUPPLY_TRANCHE_PLAN_FILE:}
gcsp.supply.policy-file=${GCSP_SUPPLY_POLICY_FILE:}

# Vehicle evidence (FUCQ-459): "none" answers source-unavailable; "lookup" or "alternate-offline" read retained files in place.
gcsp.evidence.provider=${GCSP_VEHICLE_EVIDENCE_PROVIDER:none}
gcsp.evidence.store=${GCSP_VEHICLE_EVIDENCE_STORE:}
gcsp.evidence.reference-dir=${GCSP_VEHICLE_EVIDENCE_REFERENCE_DIR:}
gcsp.evidence.assets-root=${GCSP_VEHICLE_ASSETS_ROOT:}
gcsp.evidence.alternate-file=${GCSP_VEHICLE_EVIDENCE_ALTERNATE_FILE:}
gcsp.evidence.images-public=${GCSP_VEHICLE_IMAGES_PUBLIC:false}
gcsp.evidence.timeout-ms=${GCSP_VEHICLE_EVIDENCE_TIMEOUT_MS:1000}
gcsp.evidence.max-attempts=${GCSP_VEHICLE_EVIDENCE_MAX_ATTEMPTS:1}

# Order approvals: "none" leaves every decision unavailable; "synthetic" is a labelled scenario input; "live-stub" refuses honestly.
gcsp.approvals.provider=${GCSP_APPROVALS_PROVIDER:none}
gcsp.approvals.policy-file=${GCSP_APPROVALS_POLICY_FILE:}

# Old-car returns: provider none (default), synthetic or live-stub; unknown values stop startup. The policy file is the retained Node format.
gcsp.returns.provider=${GCSP_RETURNS_PROVIDER:none}
gcsp.returns.policy-file=${GCSP_RETURNS_POLICY_FILE:}
