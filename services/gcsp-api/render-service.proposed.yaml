# PROPOSED for render.gcsp-buddy-dev.yaml and its twin render.gcsp-buddy.yaml (GC is their single writer; this file
# is not read by Render). Add under `services:` in both, with the twin's names and branch. Render has no native Java runtime, so it builds
# the Dockerfile; buildCommand/startCommand do not apply to runtime: docker.
  - type: web
    name: gcsp-buddy-dev-api
    runtime: docker
    plan: starter          # Gary's choice: Starter, 0.5 CPU / 512 MB (plan ID 0.5c-512mb). Idle RSS is about 115 MB.
    region: frankfurt
    branch: gcsp-poc-dev
    dockerfilePath: ./services/gcsp-api/Dockerfile
    dockerContext: .          # repo root: the build reads retained policy data from server/gcsp
    healthCheckPath: /q/health/ready
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - services/gcsp-api/**
        - server/gcsp/policy/seed-v1.json
        - server/gcsp/policy/reviewed/**
        - server/gcsp/predict/records/policy-definitions.json
      ignoredPaths:
        - services/gcsp-api/README.md
        - services/gcsp-api/render-service.proposed.yaml
    envVars:
      # PORT is injected by Render; the service binds to it.
      - key: GCSP_IDENTITY_PROVIDER
        value: none            # refuses every context call; set oidc with the GCSP_OIDC_* values below
      - key: GCSP_ALLOWED_ORIGINS
        sync: false            # exact static-site origin(s), comma separated (FUCQ-435)
      # Needed when GCSP_IDENTITY_PROVIDER=oidc (FUCQ-455); values are public settings, not secrets.
      # - key: GCSP_OIDC_ISSUER
      #   sync: false
      # - key: GCSP_OIDC_JWKS_URI
      #   sync: false
      # - key: GCSP_OIDC_AUDIENCE
      #   sync: false
      # - key: GCSP_OIDC_AUTHORIZED_PARTY
      #   sync: false
      # - key: GCSP_OIDC_REQUIRED_SCOPES
      #   sync: false
      # - key: GCSP_OIDC_ROLE_CLAIM
      #   sync: false
      # - key: GCSP_OIDC_ACCOUNTS
      #   sync: false
      # - key: GCSP_ENVIRONMENT_ID
      #   sync: false
      # - key: GCSP_RUN_ID
      #   sync: false
      # - key: GCSP_POLICY_VERSION
      #   sync: false
      # A value ending +offer-journey-v1 (e.g. gcsp-policy-v1+offer-journey-v1) adopts the reviewed decline reasons at startup.
      # - key: GCSP_LEARNING_ACTIVE_MODEL
      #   sync: false
      # sha256:<64 hex> model id; needs GCSP_POLICY_VERSION ending +learned-model-v1 (not combinable with +offer-journey-v1).
      # Account records (FUCQ-458), dedicated dev database only: needs GCSP_DATABASE_URL and the oidc values above.
      # - key: GCSP_ACCOUNT_PROVIDER
      #   value: repository
      # Demo people seeded at first start; needs GCSP_RESET_ALLOWED=true on the dev database, never on a running one.
      # - key: GCSP_SCENARIO_PROVIDER
      #   value: demo
      # Notifications (FUCQ-469): unset GCSP_MAIL_TRANSPORT keeps mail captured; brevo needs the rest.
      # - key: GCSP_MAIL_TRANSPORT
      #   sync: false
      # - key: GCSP_PUBLIC_BASE_URL
      #   sync: false
      # - key: GCSP_MAIL_FROM
      #   sync: false
      # - key: GCSP_MAIL_FROM_NAME
      #   sync: false
      # - key: GCSP_BREVO_API_KEY
      #   sync: false
      # Stock supply (FUCQ-462): synthetic demo stock from policy windows and confirmed Production supply; needs the database.
      # - key: GCSP_SUPPLY_PROVIDER
      #   value: demo
      # Vehicle evidence (FUCQ-459, proposed for GC): provider none until the retained files are in the image or on a disk.
      # The paths below are absolute in the container; see README "Artifacts and hosting" for what to copy.
      - key: GCSP_VEHICLE_EVIDENCE_PROVIDER
        value: none            # lookup | alternate-offline once the files below exist
      # - key: GCSP_VEHICLE_EVIDENCE_STORE
      #   value: /app/data/vehicle-evidence/fleet-source.v1
      # - key: GCSP_VEHICLE_EVIDENCE_REFERENCE_DIR
      #   value: /app/data/vehicle-evidence
      # - key: GCSP_VEHICLE_ASSETS_ROOT
      #   value: /app
      # - key: GCSP_VEHICLE_EVIDENCE_ALTERNATE_FILE   # alternate-offline only
      #   sync: false
      # - key: GCSP_VEHICLE_IMAGES_PUBLIC             # opt in only if images must load without a bearer
      #   value: "false"
      # Comparison jobs (FUCQ-480): reads of retained results need nothing; Greg job starts need the database and true.
      # A full process-only job takes about 70 minutes and a ~3 GB heap (FUCQ-507), so about a 4 GB instance.
      # - key: GCSP_COMPARISON_RERUNS
      #   value: "true"
      # - key: GCSP_CODE_REVISION     # result provenance; unknown when unset
      #   sync: false
      # Handover journey (FUCQ-472): every lifecycle provider synthetic over the isolated dev database; none refuses.
      - key: GCSP_ORDERING_PROVIDER
        value: synthetic
      - key: GCSP_APPROVALS_PROVIDER
        value: synthetic
      - key: GCSP_DOCUMENTS_PROVIDER
        value: synthetic
      - key: GCSP_APPOINTMENTS_PROVIDER
        value: synthetic
      # Old-car returns (FUCQ-473): synthetic; also runs the handover current-car change.
      - key: GCSP_RETURNS_PROVIDER
        value: synthetic
      # Buddy allocation (FUCQ-464): recommendation on the dev service; none refuses every allocation.
      - key: GCSP_ALLOCATION_CANDIDATES_PROVIDER
        value: recommendation
      - key: GCSP_SHUTDOWN_TIMEOUT
        value: 10s
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75
      # Dev composition checked by FUCQ-454 on 2026-11-17 (dispatcher-learnings 12:30, 15:00, 17:10, 17:55):
      # active values for the providers above that are still commented, plus the dedicated dev database.
      - key: GCSP_ACCOUNT_PROVIDER
        value: repository
      - key: GCSP_SCENARIO_PROVIDER
        value: demo
      - key: GCSP_SUPPLY_PROVIDER
        value: demo
      - key: GCSP_DATABASE_URL
        sync: false            # jdbc:postgresql://host:5432/db of the dedicated dev database only
      - key: GCSP_DATABASE_USER
        sync: false
      - key: GCSP_DATABASE_PASSWORD
        sync: false
      - key: GCSP_EXPECTED_DATABASE
        sync: false            # exact database name; mismatch refuses startup and reset
      - key: GCSP_ENVIRONMENT_ID
        sync: false
      - key: GCSP_RUN_ID
        value: run-1
      - key: GCSP_POLICY_VERSION
        value: gcsp-policy-v1
      - key: GCSP_RESET_ALLOWED
        value: "true"          # dev database only, fixed at its first claim; never on a running one
      # Readiness (and so the Render health check) stays 503 until every listed provider is configured.
      # identity needs GCSP_IDENTITY_PROVIDER=oidc and the GCSP_OIDC_* values (FUCQ-455).
      - key: GCSP_REQUIRED_PROVIDERS
        value: identity,persistence,account,scenario,supply,allocation-candidates,ordering,approvals,documents,appointments,returns
