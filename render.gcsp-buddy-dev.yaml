# Render Blueprint for GCSP Buddy, one per environment: Java API, Angular site and the demo picker (HLD review Q1, Q2).
# Blueprint Path render.gcsp-buddy-dev.yaml, branch gcsp-poc-dev. Its twin for the other environment differs only in
# service names, the hostnames derived from them and branch (render-gcsp-buddy-drift.test.js).
# Cutover and setup: docs/gcsp/fucq482-cutover-2026-11-19.md. Sign-in values are committed (built-in demo issuer, FUCQ-532);
# only environment context, database and mail secrets stay sync: false and are never committed here.

# Each environment's PostgreSQL (Basic-256mb) is created in the dashboard and supplied through sync: false keys:
# GCSP_DATABASE_URL must be JDBC form and Render does not interpolate a fromDatabase value. Never the retired gcsp-db.

services:
  - type: web
    name: gcsp-buddy-dev-site
    runtime: static
    branch: gcsp-poc-dev
    autoDeployTrigger: commit
    buildFilter:           # only what the build copies; keep in step with the cp list (render-blueprint.test.js checks)
      paths:
        - index.html
        - block.html
        - components.html
        - gcsp-employee.css
        - blocks/**
        - assets/**
    # Copies only what a browser needs (about 3 MB, not the fixtures) and points both pages at bmw-matcher-api.
    buildCommand: >-
      test -n "$GCSP_API_URL" &&
      mkdir -p _site &&
      cp -R index.html block.html components.html
      gcsp-employee.css blocks assets _site/ &&
      sed -i "s|https://bmw-matcher-api.onrender.com|$GCSP_API_URL|" _site/blocks/demo-launcher/boot.js &&
      sed -i "s|data-api=\"http://localhost:8787\"|data-api=\"$GCSP_API_URL\"|" _site/block.html &&
      grep -q "$GCSP_API_URL" _site/blocks/demo-launcher/boot.js &&
      grep -q "$GCSP_API_URL" _site/block.html
    staticPublishPath: _site
    envVars:
      - key: GCSP_API_URL          # Used Cars API (bmw-matcher-api, render.yaml) for the demo picker; no GCSP API
        value: https://bmw-matcher-api.onrender.com

  # GCSP API: Java 21 / Quarkus. No Node GCSP runtime remains in this blueprint.
  - type: web
    name: gcsp-buddy-dev-api
    runtime: docker
    plan: starter          # Gary's choice: Starter, 0.5 CPU / 512 MB (plan ID 0.5c-512mb). Idle RSS is about 115 MB.
    region: frankfurt
    branch: gcsp-poc-dev
    dockerfilePath: ./services/gcsp-api/Dockerfile
    dockerContext: .          # repo root: the build reads retained policy data from server/gcsp
    healthCheckPath: /q/health/ready
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - services/gcsp-api/**
        - server/gcsp/policy/seed-v1.json
        - server/gcsp/policy/reviewed/**
        - server/gcsp/predict/records/policy-definitions.json
        - server/data/gcsp/comparison/process-only.json
        - docs/gcsp/models/artifacts/**
        - server/data/gcsp/vehicle-evidence/fleet-source.v1/active.json
        - server/data/gcsp/vehicle-evidence/fleet-source.v1/last-good.json
        - server/data/gcsp/vehicle-evidence/fleet-source.v1/identity-inventory.json
        - server/data/gcsp/vehicle-evidence/fleet-source.v1/versions/28374a10e989560f036c912c4b3d6d6b22d69d5ec212aecfc3921bc202af7884/**
        - server/data/gcsp/vehicle-evidence/fleet-source.v1/versions/9b514af9f883ce360fe7f42de16bd19d7a74f570e77cc9b6fb094f559aef9043/**
        - server/data/gcsp/vehicle-evidence/display-images.v1.json
        - server/data/gcsp/vehicle-evidence/configuration-definitions.v1.json
        - assets/gcsp-vehicle-evidence/**
      ignoredPaths:
        - services/gcsp-api/README.md
        - services/gcsp-api/render-service.proposed.yaml
    envVars:
      # PORT is injected by Render; the service binds to it.
      # FUCQ-532: hosted sign-in uses the built-in demo issuer at /demo-idp on this API (fictional people only).
      # Refuses to start unless identity is oidc, scenario is demo and the database is set. Lifetimes stay at defaults.
      - key: GCSP_IDENTITY_PROVIDER
        value: oidc
      - key: GCSP_DEMO_IDP_ENABLED
        value: "true"          # labelled demo issuer, fictional people only (FUCQ-532); off by default elsewhere
      - key: GCSP_ALLOWED_ORIGINS
        value: https://gcsp-buddy-dev-web.onrender.com   # exact Angular origin (FUCQ-435); the browser's discovery and token fetches need it
      - key: GCSP_OIDC_ISSUER
        value: https://gcsp-buddy-dev-api.onrender.com/demo-idp
      - key: GCSP_OIDC_JWKS_URI
        value: https://gcsp-buddy-dev-api.onrender.com/demo-idp/jwks
      - key: GCSP_OIDC_AUDIENCE
        value: gcsp-api
      - key: GCSP_OIDC_AUTHORIZED_PARTY
        value: gcsp-web        # browser public client id; same as frontend oidc.clientId
      - key: GCSP_OIDC_REQUIRED_SCOPES
        value: gcsp-api
      - key: GCSP_OIDC_ROLE_CLAIM
        value: realm_access.roles
      - key: GCSP_OIDC_ACCOUNTS
        value: '[{"subject":"demo-paula","roles":["employee"],"employeeId":"employee-paula"},{"subject":"demo-alex","roles":["employee"],"employeeId":"employee-alex"},{"subject":"demo-sam","roles":["employee"],"employeeId":"employee-sam"},{"subject":"demo-jordan","roles":["employee"],"employeeId":"employee-jordan"},{"subject":"demo-greg","roles":["greg","employee"],"employeeId":"operator-greg"},{"subject":"demo-presenter","roles":["presenter"]}]'   # one entry per demo person; the presenter has no employee id
      - key: GCSP_DEMO_IDP_REDIRECT_URIS
        value: https://gcsp-buddy-dev-web.onrender.com/gcsp/auth/callback
      - key: GCSP_DEMO_IDP_POST_LOGOUT_REDIRECT_URIS
        value: https://gcsp-buddy-dev-web.onrender.com/gcsp/
      - key: GCSP_RUN_ID
        sync: false
      - key: GCSP_POLICY_VERSION
        sync: false
      - key: GCSP_SHUTDOWN_TIMEOUT
        value: 10s
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75
      # FUCQ-456 / FUCQ-434 comment 3629372: this environment's own isolated Java persistence.
      # Supply JDBC jdbc:postgresql://host:5432/db from its own database details;
      # never reuse the retired Node gcsp-db. Flyway owns the gcsp_app schema.
      - key: GCSP_DATABASE_URL
        sync: false
      - key: GCSP_DATABASE_USER
        sync: false
      - key: GCSP_DATABASE_PASSWORD
        sync: false
      - key: GCSP_EXPECTED_DATABASE
        sync: false            # exact database name; mismatch refuses startup/reset
      - key: GCSP_ENVIRONMENT_ID
        sync: false            # deployment context; same as the web service's GCSP_PUBLIC_ENVIRONMENT_ID
      - key: GCSP_RESET_ALLOWED
        value: "true"          # presenter resets; fixed at the database's first claim
      - key: GCSP_DATABASE_POOL_SIZE
        value: "10"            # application's default maximum connections
      # Demo composition (FUCQ-482): every adapter is labelled synthetic or demo; none is a BMW system.
      - key: GCSP_REQUIRED_PROVIDERS   # readiness stays DOWN while any of these is none
        value: identity,persistence,account,scenario,supply,allocation-candidates,ordering,approvals,documents,appointments,returns,production,evidence
      - key: GCSP_SCENARIO_PROVIDER
        value: demo            # fictional people; needs a database claimed with GCSP_RESET_ALLOWED=true
      - key: GCSP_SUPPLY_PROVIDER
        value: demo            # none | tranche-plan | demo
      # tranche-plan requires a deployment-supplied plan; this image ships neither file.
      # Empty supply policy keeps releases pending as policy-unavailable.
      # - key: GCSP_SUPPLY_TRANCHE_PLAN_FILE
      #   sync: false
      # - key: GCSP_SUPPLY_POLICY_FILE
      #   sync: false
      - key: GCSP_ACCOUNT_PROVIDER
        value: repository      # none | hr-snapshot | repository
      # hr-snapshot requires a deployment-supplied export; repository needs the isolated DB above.
      # - key: GCSP_ACCOUNT_HR_SNAPSHOT_PATH
      #   sync: false
      - key: GCSP_ALLOCATION_CANDIDATES_PROVIDER
        value: recommendation  # none refuses every Buddy allocation
      - key: GCSP_DOCUMENTS_PROVIDER
        value: synthetic       # fictional; live remains unsupported
      # FUCQ-468: fictional ordering for this isolated API; approvals reads its store.
      - key: GCSP_ORDERING_PROVIDER
        value: synthetic       # requires this environment's dedicated PostgreSQL database above
      # Hosted retained-image check is Gary's end-of-build review item.
      - key: GCSP_VEHICLE_EVIDENCE_PROVIDER
        value: lookup          # lookup | alternate-offline; no alternate file is shipped
      - key: GCSP_VEHICLE_EVIDENCE_STORE
        value: /app/data/vehicle-evidence/fleet-source.v1
      - key: GCSP_VEHICLE_EVIDENCE_REFERENCE_DIR
        value: /app/data/vehicle-evidence
      - key: GCSP_VEHICLE_ASSETS_ROOT
        value: /app
      # - key: GCSP_VEHICLE_EVIDENCE_ALTERNATE_FILE
      #   sync: false
      - key: GCSP_VEHICLE_IMAGES_PUBLIC
        value: "false"         # retained images still require a bearer
      - key: GCSP_APPOINTMENTS_PROVIDER
        value: synthetic       # fictional; live remains unsupported
      - key: GCSP_RETURNS_PROVIDER
        value: synthetic       # fictional; live-stub remains unsupported
      # Optional retained return policy; unset is unavailable, with no canonical fallback.
      # - key: GCSP_RETURNS_POLICY_FILE
      #   sync: false
      # Mail stays captured when unset; brevo requires every mail setting below.
      - key: GCSP_MAIL_TRANSPORT
        sync: false
      # Use the Angular HTTPS base serving /gcsp/offers/:offerId, not the API host.
      - key: GCSP_PUBLIC_BASE_URL
        sync: false
      - key: GCSP_MAIL_FROM
        sync: false
      - key: GCSP_MAIL_FROM_NAME
        sync: false
      - key: GCSP_BREVO_API_KEY
        sync: false
      # Optional notification drain interval: 1s to 10m; unset defaults to 5s.
      # - key: GCSP_NOTIFY_DRAIN_INTERVAL
      #   value: 5s
      - key: GCSP_APPROVALS_PROVIDER
        value: synthetic       # fictional; none | synthetic | live-stub
      # Optional file override; unset keeps the canonical PolicyService.
      # - key: GCSP_APPROVALS_POLICY_FILE
      #   sync: false
      - key: GCSP_PRODUCTION_PROVIDER
        value: synthetic       # fictional; live-stub refuses
      - key: GCSP_CODE_REVISION
        sync: false            # the deployed commit, recorded in comparison manifests

  - type: web
    name: gcsp-buddy-dev-web
    runtime: static
    branch: gcsp-poc-dev
    autoDeployTrigger: commit
    buildCommand: >-
      npm install --global npm@11.19.1 &&
      npm ci --prefix apps/gcsp-web &&
      npm run gcsp:compile &&
      npm run gcsp:assemble --
      --browser apps/gcsp-web/dist/gcsp-web/browser
      --output _gcsp-site --environment deployed --revision "$RENDER_GIT_COMMIT"
    staticPublishPath: _gcsp-site
    buildFilter:
      paths:
        - apps/gcsp-web/**
        - blocks/gcsp/shell/**
        - designs/**
        - scripts/build-gcsp-static.mjs
        - scripts/assemble-site.mjs
        - scripts/gcsp-runtime-config.mjs
        - _config/gcsp-runtime-config.schema.json
        - package.json
        - package-lock.json
        - render.gcsp-buddy-dev.yaml
      ignoredPaths:
        - apps/gcsp-web/**/*.spec.ts
        - apps/gcsp-web/**/*.md
        - apps/gcsp-web/vitest.config.ts
        - apps/gcsp-web/tsconfig.spec.json
    # Existing app routes precede resource exclusions and unknown-page recovery.
    # Render placeholders match one segment, including asset-looking offer IDs.
    routes:
      - type: redirect
        source: /gcsp
        destination: /gcsp/
      - type: rewrite
        source: /gcsp/
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/sign-in
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/auth/callback
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/account
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/preferences
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/stock
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/manual/review
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/manual/summary
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/activity
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/orders
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/help
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/greg
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/greg/cases
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/greg/plan
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/comparison
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/presenter
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/presenter/outbox
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/components
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/access-denied
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/unavailable
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/offers/:offerId
        destination: /gcsp/index.html
      # Existing files are served before Render evaluates rewrites. Reserve
      # resource namespaces and filenames so a missing asset stays a real 404.
      # The absent destination is outside the Angular fallback and build output.
      - type: rewrite
        source: /gcsp/assets/*
        destination: /gcsp-static-resource-not-found
      - type: rewrite
        source: /gcsp/media/*
        destination: /gcsp-static-resource-not-found
      - type: rewrite
        source: /gcsp/api/*
        destination: /gcsp-static-resource-not-found
      - type: rewrite
        source: /gcsp/*.*
        destination: /gcsp-static-resource-not-found
      - type: rewrite
        source: /gcsp/*
        destination: /gcsp/index.html
    headers:
      - path: /gcsp/*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - path: /gcsp/*
        name: Referrer-Policy
        value: no-referrer
      - path: /gcsp/*
        name: X-Content-Type-Options
        value: nosniff
      - path: /gcsp
        name: Cache-Control
        value: no-store
      - path: /gcsp/index.html
        name: Cache-Control
        value: no-store
      - path: /gcsp/runtime-config.json
        name: Cache-Control
        value: no-store
      - path: /gcsp/
        name: Cache-Control
        value: no-store
      - path: /gcsp/sign-in
        name: Cache-Control
        value: no-store
      - path: /gcsp/auth/callback
        name: Cache-Control
        value: no-store
      - path: /gcsp/account
        name: Cache-Control
        value: no-store
      - path: /gcsp/preferences
        name: Cache-Control
        value: no-store
      - path: /gcsp/stock
        name: Cache-Control
        value: no-store
      - path: /gcsp/manual/review
        name: Cache-Control
        value: no-store
      - path: /gcsp/manual/summary
        name: Cache-Control
        value: no-store
      - path: /gcsp/activity
        name: Cache-Control
        value: no-store
      - path: /gcsp/orders
        name: Cache-Control
        value: no-store
      - path: /gcsp/help
        name: Cache-Control
        value: no-store
      - path: /gcsp/greg
        name: Cache-Control
        value: no-store
      - path: /gcsp/greg/cases
        name: Cache-Control
        value: no-store
      - path: /gcsp/greg/plan
        name: Cache-Control
        value: no-store
      - path: /gcsp/comparison
        name: Cache-Control
        value: no-store
      - path: /gcsp/presenter
        name: Cache-Control
        value: no-store
      - path: /gcsp/presenter/outbox
        name: Cache-Control
        value: no-store
      - path: /gcsp/components
        name: Cache-Control
        value: no-store
      - path: /gcsp/access-denied
        name: Cache-Control
        value: no-store
      - path: /gcsp/unavailable
        name: Cache-Control
        value: no-store
      - path: /gcsp/offers/*
        name: Cache-Control
        value: no-store
      - path: /gcsp/*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /gcsp/*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /gcsp/media/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /gcsp/assets/*
        name: Cache-Control
        value: no-cache
      - path: /gcsp/static-manifest.json
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: "24.22.3"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: GCSP_PUBLIC_ENVIRONMENT_ID
        sync: false
      - key: GCSP_PUBLIC_API_BASE_URL
        value: https://gcsp-buddy-dev-api.onrender.com/api/gcsp/v1
      - key: GCSP_PUBLIC_OIDC_AUTHORITY
        value: https://gcsp-buddy-dev-api.onrender.com/demo-idp
      - key: GCSP_PUBLIC_OIDC_CLIENT_ID
        value: gcsp-web
      - key: GCSP_PUBLIC_OIDC_SCOPE
        value: openid profile gcsp-api
      - key: GCSP_PUBLIC_OIDC_REDIRECT_URI
        value: https://gcsp-buddy-dev-web.onrender.com/gcsp/auth/callback
      - key: GCSP_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI
        value: https://gcsp-buddy-dev-web.onrender.com/gcsp/
