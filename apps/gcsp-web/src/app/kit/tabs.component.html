<div class="gcsp-tabs">
  <div class="gcsp-tabs-list" role="tablist" [attr.aria-label]="label()">
    @for (item of items(); track item.id; let index = $index) {
      <button class="gcsp-tab" type="button" role="tab" [id]="idPrefix + '-tab-' + index" [attr.aria-controls]="idPrefix + '-panel-' + index" [attr.aria-selected]="selectedId() === item.id" [attr.tabindex]="selectedId() === item.id ? 0 : -1" (click)="select(item.id)" (keydown)="onKeydown($event, index)">{{ item.label }}</button>
    }
  </div>
  @for (item of items(); track item.id; let index = $index) {
    <div class="gcsp-tab-panel" role="tabpanel" [id]="idPrefix + '-panel-' + index" [attr.aria-labelledby]="idPrefix + '-tab-' + index" [attr.hidden]="selectedId() !== item.id ? '' : null" tabindex="0"><ng-container [ngTemplateOutlet]="item.content" /></div>
  }
</div>
