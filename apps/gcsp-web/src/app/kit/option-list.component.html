<div [class]="variant() === 'rows' ? 'vm-options vm-options-rows' : 'gcsp-options'" role="radiogroup" [id]="groupId()" [attr.aria-label]="label()" [attr.aria-disabled]="disabled()" [attr.aria-required]="required() ?? null" [attr.aria-invalid]="invalid() ?? null">
  @for (option of options(); track option.value) {
    <button #optionButton type="button" [class]="variant() === 'rows' ? 'vm-option' : 'gcsp-option'" role="radio"
      [value]="option.value" [class.is-selected]="value() === option.value" [attr.aria-checked]="value() === option.value"
      [disabled]="disabled() || option.disabled" [tabIndex]="tabValue() === option.value ? 0 : -1"
      (click)="choose(option)" (keydown)="navigate($event, option)">
      <span [class]="variant() === 'rows' ? 'vm-option-label' : 'gcsp-option-label'">{{ option.label }}</span>
      @if (option.sub) { <span [class]="variant() === 'rows' ? 'vm-option-sub' : 'gcsp-option-sub'">{{ option.sub }}</span> }
    </button>
  }
</div>
