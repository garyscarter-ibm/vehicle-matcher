<div #root class="gcsp-side-drawer" hidden>
  <div class="gcsp-side-drawer-backdrop" (click)="onDialogClick($event)"></div>
  <aside #panel class="gcsp-side-drawer-panel" role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId">
    <div class="gcsp-side-drawer-head">
      <div class="gcsp-side-drawer-titles">
        @if (context()) { <p class="gcsp-side-drawer-context">{{ context() }}</p> }
        <h2 #heading class="gcsp-side-drawer-title" [id]="titleId" tabindex="-1">{{ title() }}</h2>
      </div>
      <button gcspButton presentation="source" type="button" variant="ghost" [disabled]="!dismissible()" aria-label="Close" (click)="onDialogClick($event)">Close</button>
    </div>
    <div class="gcsp-side-drawer-body"><ng-content /></div>
    <div class="gcsp-side-drawer-foot"><ng-content select="[drawer-footer]" /></div>
  </aside>
</div>
