name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push to main: the branded
# demo homepage (index.html, served at /), the standalone harness (block.html),
# and the block itself (blocks/). Both pages are brand-agnostic — ?brand=bmw|mini
# picks the marque. No build step — the EDS block's paths
# are relative, so the files serve as-is. The backend URL is baked into the
# harness at deploy time, so a shared link needs no ?api= query string.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh product map inputs]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The deployed backend the published harness talks to, baked into its
  # data-api attribute at publish time. Must run the current server code (it
  # sends decisive/clusterSize and per-car colour). Leave blank to keep the
  # localhost default, in which case a page needs the ?api=<url> override.
  API_URL: https://bmw-matcher-api.onrender.com

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Collect pushed product map inputs
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          # GCSP owns delivery facts; main owns the trusted generator and retail site.
          git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/gcsp-poc

      # Only the files a browser actually asks for. The repo root also holds
      # server/, scripts/ and ~16MB of stock fixtures, none of which a static
      # page needs — publishing `.` would ship the lot on every deploy.
      #
      # assets/ carries the brand logos (and hero photos when present) that
      # index.html requests at assets/brand-logos/<brand>.svg. It is small
      # (~56K) and must ship, or every mark 404s and the picker/nav silently
      # fall back to their text wordmarks. The block's fonts need no entry here:
      # they live inside blocks/vehicle-matcher/fonts/ behind relative ./fonts/
      # urls, so cp -R blocks already takes them.
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R index.html block.html blocks assets _site/
          if [ -n "${API_URL}" ]; then
            # The harness hardcodes the local default; point it at the deployed
            # backend. Exact match, so only that one attribute is ever rewritten.
            find _site -maxdepth 1 -name '*.html' -exec \
              sed -i "s|data-api=\"http://localhost:8787\"|data-api=\"${API_URL}\"|g" {} +

            # Then prove it landed. A failed rewrite does not reliably fail this
            # step (find -exec ... + does not always surface the child's status),
            # so trusting the exit code would let us publish a site still calling
            # localhost:8787 while the job reports success.
            if grep -rl 'data-api="http://localhost:8787"' _site --include='*.html'; then
              echo "::error::API_URL rewrite did not apply to the files listed above"
              exit 1
            fi
            echo "API rewrite ok: $(grep -ho 'data-api="[^"]*"' _site/*.html | sort -u)"
          fi
          echo "Published tree:"
          find _site -maxdepth 2 -name '*.html' | sort
          du -sh _site

          # Fail the deploy if a logo index.html asks for is missing, rather
          # than publishing a build whose marks 404 into text fallbacks (the
          # fallback is deliberate for an unsourced brand, but it must not be
          # how we find out the copy step regressed). Brands are read from the
          # page itself, so a newly-onboarded marque is covered automatically.
          echo "Checking brand logos shipped:"
          missing=0
          for b in $(grep -o "^\s*[a-z]\+: {$" index.html | tr -d ' :{'); do
            if [ -f "_site/assets/brand-logos/${b}.svg" ]; then
              echo "  ok       ${b}.svg"
            else
              echo "  MISSING  ${b}.svg"
              missing=$((missing + 1))
            fi
          done
          if [ "${missing}" -gt 0 ]; then
            echo "::error::${missing} brand logo(s) missing from _site/assets/brand-logos/"
            exit 1
          fi

      # Only the trusted main projector executes. Branches supply JSON facts.
      - name: Build the connected product map
        run: python3 -I -B _tools/product_map.py build --output _site/product-map

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
