name: F555 canonical Java verification proposal

on:
  push:
    branches:
      - gcsp-poc-dev
    paths:
      - .github/workflows/f555-java-ci.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Verification scope (diagnostic is not a canonical batch)
        required: true
        default: canonical
        type: choice
        options:
          - canonical
          - default-profile
          - browser

permissions:
  contents: read

jobs:
  canonical-java:
    if: github.event_name == 'push' || inputs.mode != 'browser'
    name: ${{ github.event_name == 'push' && 'Canonical Java suite' || inputs.mode == 'canonical' && 'Canonical Java suite' || inputs.mode == 'default-profile' && 'Default profile diagnostic (not canonical)' || 'Invalid scope (refused)' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GCSP_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/gcsp_test_dev?user=gcsp
      GCSP_TEST_RUNNING_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/gcsp_test_running?user=gcsp
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_USER: gcsp
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --memory=2g --memory-swap=2g --cpus=1 --shm-size=256m
          --health-cmd "pg_isready -U gcsp -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 24

    steps:
      - name: Check out the event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 24.22.3
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'

      - name: Run the owned Java scope (${{ github.event_name == 'push' && 'canonical' || inputs.mode || 'invalid' }})
        timeout-minutes: 85
        shell: bash
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
          F555_EVENT_NAME: ${{ github.event_name }}
          F555_REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import signal
          import subprocess
          import sys
          import tempfile
          import threading
          import time
          import xml.etree.ElementTree as ET

          GIB = 1024 ** 3
          MIB = 1024 ** 2
          RSS_CAP = 12 * GIB
          SCRATCH_TARGET_CAP = 2 * GIB
          FREE_DISK_RESERVE = 5 * GIB
          SAMPLE_SECONDS = 5
          DISK_SAMPLE_SECONDS = 60
          CHECKPOINT_SECONDS = 300
          def select_scope(event, requested):
              if event == "push":
                  mode = "canonical"
              elif event == "workflow_dispatch" and requested in ("canonical", "default-profile"):
                  mode = requested
              else:
                  raise ValueError("unknown Java verification event or mode; launch refused")
              if mode == "canonical":
                  return mode, ["./mvnw", "-B", "clean", "verify"], 80 * 60
              return mode, ["./mvnw", "-B", "clean", "test", "-Dtest=gcsp.api.DefaultProfileTest"], 600

          scope_error = None
          try:
              mode, command_argv, COMMAND_SECONDS = select_scope(
                  os.environ.get("F555_EVENT_NAME", ""), os.environ.get("F555_REQUESTED_MODE", "")
              )
          except ValueError as error:
              mode, command_argv, COMMAND_SECONDS = "invalid", [], 0
              scope_error = str(error)
          scope = {"mode": mode, "canonical_inventory": mode == "canonical",
                   "label": "Canonical Java suite" if mode == "canonical" else
                            "Default profile diagnostic (not a canonical batch)" if mode == "default-profile"
                            else "Invalid scope (launch refused)"}
          LOG_TAIL_CAP = 256 * 1024
          CONSOLE_CAP = 64 * 1024
          CONSOLE_EVENT_CAP = 2048
          SKIP_DETAIL_CAP = 128 * 1024
          FAILED_IDENTITY_CAP = 128 * 1024
          CASE_INVENTORY_CAP = 1024 * 1024
          REPORT_INVENTORY_CAP = 256 * 1024
          FAILURE_SAMPLE_CAP = 256 * 1024
          FAILURE_CLASS_CAP = 16 * 1024
          PROCESS_TELEMETRY_CAP = 512 * 1024

          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          sha = os.environ["GITHUB_SHA"]
          prefix = f"f555-java-{run_id}-{attempt}"
          if mode != "canonical":
              prefix += "-" + mode
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          api_dir = workspace / "services/gcsp-api"
          target = api_dir / "target"
          scratch = runner_temp / (prefix + "-scratch")
          receipt_path = runner_temp / (prefix + "-resource-receipt.json")
          summary_path = runner_temp / (prefix + "-surefire-summary.json")
          tail_path = runner_temp / (prefix + "-maven-tail.log")
          pg_service_id = os.environ.get("PG_SERVICE_ID", "")
          started_wall = time.time()
          started = time.monotonic()

          # No raw Maven stream reaches the Actions console. Compact progress is best-effort,
          # finite and nonblocking; the independent collector always drains the bounded tail.
          console_result = {"bytes_written": 0, "events_dropped": 0, "issue": None}
          try:
              console_fd = sys.stdout.fileno()
              os.set_blocking(console_fd, False)
          except (OSError, ValueError) as error:
              console_fd = None
              console_result["issue"] = type(error).__name__ + ": " + str(error)[:200]

          def emit_progress(value):
              payload = (json.dumps(value, separators=(",", ":")) + "\n").encode("utf-8")
              if (console_fd is None or len(payload) > CONSOLE_EVENT_CAP
                      or console_result["bytes_written"] + len(payload) > CONSOLE_CAP):
                  console_result["events_dropped"] += 1
                  return
              try:
                  written = os.write(console_fd, payload)
                  console_result["bytes_written"] += written
                  if written != len(payload):
                      console_result["events_dropped"] += 1
              except (BlockingIOError, OSError) as error:
                  console_result["events_dropped"] += 1
                  console_result["issue"] = type(error).__name__ + ": " + str(error)[:200]

          def atomic_json(path, value):
              fd, temporary = tempfile.mkstemp(prefix=".writing-", dir=str(path.parent))
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as output:
                      json.dump(value, output, sort_keys=True, separators=(",", ":"))
                      output.write("\n")
                      output.flush()
                      os.fsync(output.fileno())
                  os.replace(temporary, path)
              finally:
                  if os.path.exists(temporary):
                      os.unlink(temporary)

          def memory_info():
              values = {}
              for line in Path("/proc/meminfo").read_text(encoding="ascii").splitlines():
                  fields = line.split()
                  if fields and fields[0].rstrip(":") in ("MemTotal", "MemAvailable"):
                      values[fields[0].rstrip(":")] = int(fields[1]) * 1024
              if "MemTotal" not in values or "MemAvailable" not in values:
                  raise RuntimeError("could not read actual runner memory from /proc/meminfo")
              return values

          def command_output(args, cwd=None, timeout=10):
              result = subprocess.run(args, cwd=cwd, capture_output=True, text=True, timeout=timeout)
              if result.returncode:
                  raise RuntimeError("command failed: " + Path(args[0]).name)
              return (result.stdout + result.stderr).strip()

          def process_snapshot():
              result = subprocess.run(
                  ["/bin/ps", "-axo", "pid=,ppid=,pgid=,rss=,stat=,lstart=,comm="],
                  capture_output=True, text=True, timeout=5
              )
              if result.returncode or result.stderr or not result.stdout.strip():
                  raise RuntimeError("incomplete host process snapshot")
              rows = {}
              for line in result.stdout.splitlines():
                  fields = line.split(None, 10)
                  if len(fields) != 11:
                      raise RuntimeError("unparseable host process row")
                  pid, parent, group, rss = map(int, fields[:4])
                  rows[pid] = {
                      "pid": pid, "ppid": parent, "pgid": group, "rss": rss * 1024,
                      "stat": fields[4], "start": " ".join(fields[5:10]), "comm": fields[10]
                  }
              return rows

          def process_closure(seeds, rows):
              owned = set(seeds) & set(rows)
              while True:
                  expanded = owned | {pid for pid, row in rows.items() if row["ppid"] in owned}
                  if expanded == owned:
                      return owned
                  owned = expanded

          def allocated_bytes(root):
              total = 0
              if not os.path.lexists(root):
                  return total
              for folder, directories, files in os.walk(root, followlinks=False):
                  for name in directories + files:
                      try:
                          stat = os.lstat(os.path.join(folder, name))
                          total += max(stat.st_size, getattr(stat, "st_blocks", 0) * 512)
                      except FileNotFoundError:
                          pass
              return total

          def live_group_rows(rows, group):
              return [row for row in rows.values()
                      if row["pgid"] == group and not row["stat"].startswith("Z")]

          def sanitize_diagnostic(value):
              text = str(value)
              text = re.sub(r"-----BEGIN [^-]*PRIVATE KEY-----.*?(?:-----END [^-]*PRIVATE KEY-----|\Z)",
                            "[private key redacted]", text, flags=re.S)
              text = re.sub(r"(?i)([a-z][a-z0-9+.-]*://)[^/\s@]+@", r"\1[redacted]@", text)
              sensitive = re.compile(
                  r"(?i)(?<![A-Za-z0-9])(?:authorization|bearer|password|passwd|secret|credentials?|token|"
                  r"api[_. -]?key|private[_. -]?key|signing[_. -]?jwk|rotation[_. -]?jwk)(?![A-Za-z0-9])|"
                  r"\b[A-Za-z0-9_.-]*(?:secret|password|credential|token|api[_.-]?key)[A-Za-z0-9_.-]*\s*[:=]|"
                  r"\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*|"
                  r"\\?[\"'](?:kty|d|p|q|dp|dq|qi)\\?[\"']\s*:"
              )
              return "\n".join("[sensitive diagnostic line redacted]" if sensitive.search(line) else line
                               for line in text.splitlines())

          def encoded_size(value):
              return len(json.dumps(value, ensure_ascii=True, separators=(",", ":")).encode("utf-8"))

          def bounded_diagnostic(fields, cap):
              entry = {key: sanitize_diagnostic(value) for key, value in fields.items()}
              truncated = set()
              entry["truncated_fields"] = []
              while encoded_size(entry) > cap:
                  key = max(fields, key=lambda name: len(entry[name]))
                  entry[key] = entry[key][:len(entry[key]) // 2]
                  truncated.add(key)
                  entry["truncated_fields"] = sorted(truncated)
              return entry

          def retain_process_sample(rows, maven_pids, postgres_pids, elapsed):
              telemetry = monitor["process_telemetry"]
              sample = {"elapsed_seconds": int(elapsed), "processes": [], "omitted_processes": 0}
              for pid in sorted(maven_pids | postgres_pids):
                  row = rows[pid]
                  entry = {key: row[key] for key in ("pid", "ppid", "pgid", "start", "rss")}
                  entry["comm"] = sanitize_diagnostic(Path(row["comm"]).name)[:128]
                  entry["owner"] = "maven" if pid in maven_pids else "postgres"
                  if encoded_size(sample) + encoded_size(entry) + 1 <= 32 * 1024:
                      sample["processes"].append(entry)
                  else:
                      sample["omitted_processes"] += 1
              size = encoded_size(sample) + 1
              if telemetry["bytes"] + size <= PROCESS_TELEMETRY_CAP:
                  telemetry["samples"].append(sample)
                  telemetry["bytes"] += size
              else:
                  telemetry["omitted_samples"] += 1

          def report_validation_issues(summary):
              issues = []
              if summary.get("status") != "reports-present":
                  issues.append("Surefire summary status is not reports-present")
              if summary.get("report_count", 0) <= 0:
                  issues.append("no Surefire reports")
              if summary.get("parsed_report_count") != summary.get("report_count"):
                  issues.append("not every Surefire report was parsed")
              if summary.get("parse_issue") is not None:
                  issues.append("Surefire report parsing or summary collection failed")
              if summary.get("tests", 0) <= 0 or summary.get("executed_tests", 0) <= 0:
                  issues.append("no actually executed tests")
              if summary.get("tests") != summary.get("testcase_count"):
                  issues.append("reported test total differs from parsed testcase count")
              for key, observed in (("failures", "failure_details"), ("errors", "error_details"),
                                    ("skipped", "skipped_case_count")):
                  if summary.get(key) != summary.get(observed):
                      issues.append("reported " + key + " differs from parsed testcase details")
              if summary.get("failures", 0) or summary.get("errors", 0):
                  issues.append("Surefire reports contain failures or errors")
              if summary.get("skipped_details_omitted", 0):
                  issues.append("bounded skipped-test details are incomplete")
              if mode == "default-profile" and (
                      summary.get("testcase_count") != 10 or summary.get("diagnostic_case_count") != 10
                      or summary.get("executed_tests") != 10 or summary.get("skipped", 0)):
                  issues.append("default-profile diagnostic requires its ten unskipped cases")
              return issues

          def write_summary():
              reports = sorted((target / "surefire-reports").glob("TEST-*.xml"))
              totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              failed_cases = []
              failed_identities = []
              failed_identity_bytes, failed_identity_omitted = 2, 0
              failure_samples = []
              sampled_classes = set()
              failure_sample_bytes, failure_sample_omitted = 2, 0
              diagnostic_case_count = 0
              skipped_cases = []
              skipped_bytes = 0
              skipped_omitted = 0
              testcase_count = executed_tests = parsed_reports = 0
              failure_details = error_details = skipped_count = 0
              case_inventory = []
              case_inventory_bytes, case_inventory_omitted = 2, 0
              identity_counts = collections.Counter()
              outcome_counts = collections.Counter()
              malformed_identities = 0
              report_inventory = []
              report_inventory_bytes, report_inventory_omitted, report_names_truncated = 2, 0, 0
              def retain_report(report, status, counts=None, identities=None, outcomes=None, issue=None):
                  nonlocal report_inventory_bytes, report_inventory_omitted, report_names_truncated
                  entry = bounded_diagnostic({"report": report.name}, 2048)
                  report_names_truncated += bool(entry["truncated_fields"])
                  entry.update(
                      report_name_sha256=hashlib.sha256(report.name.encode("utf-8")).hexdigest(),
                      status=status, reported_counts=counts,
                      testcase_count=sum(identities.values()) if identities is not None else None,
                      outcome_counts=outcomes,
                      identity_multiset_sha256=hashlib.sha256(json.dumps(
                          sorted(identities.items()), ensure_ascii=True, separators=(",", ":")
                      ).encode("utf-8")).hexdigest() if identities is not None else None,
                      issue=issue
                  )
                  size = encoded_size(entry) + 1
                  if report_inventory_bytes + size <= REPORT_INVENTORY_CAP:
                      report_inventory.append(entry)
                      report_inventory_bytes += size
                  else:
                      report_inventory_omitted += 1
              parse_issue = None
              try:
                  for report in reports:
                      report_counts = {key: 0 for key in totals}
                      report_identities = collections.Counter()
                      report_outcomes = {key: 0 for key in ("passed", "failure", "error", "skipped")}
                      root = ET.parse(report).getroot()
                      suites = [node for node in root.iter()
                                if node.tag.rsplit("}", 1)[-1] == "testsuite"]
                      if not suites:
                          raise ValueError("Surefire XML has no testsuite: " + report.name)
                      for suite in suites:
                          for key in totals:
                              value = int(suite.attrib[key])
                              if value < 0:
                                  raise ValueError("negative Surefire count: " + report.name)
                              totals[key] += value
                              report_counts[key] += value
                      for case in (node for node in root.iter()
                                   if node.tag.rsplit("}", 1)[-1] == "testcase"):
                          testcase_count += 1
                          diagnostic_case_count += case.attrib.get("classname") == "gcsp.api.DefaultProfileTest"
                          class_name, test_name = case.attrib.get("classname", ""), case.attrib.get("name", "")
                          malformed_identities += not class_name or not test_name
                          identity_hash = hashlib.sha256(json.dumps(
                              [class_name, test_name], ensure_ascii=True, separators=(",", ":")
                          ).encode("utf-8")).hexdigest()
                          outcomes = sorted(detail.tag.rsplit("}", 1)[-1] for detail in case
                                            if detail.tag.rsplit("}", 1)[-1] in ("failure", "error", "skipped")) or ["passed"]
                          identity_counts[identity_hash] += 1
                          outcome_counts[(identity_hash, tuple(outcomes))] += 1
                          report_identities[identity_hash] += 1
                          for outcome in outcomes:
                              report_outcomes[outcome] += 1
                          entry = bounded_diagnostic({"class": class_name, "test": test_name,
                                                      "report": report.name}, 2048)
                          entry.update(identity_sha256=identity_hash, outcomes=outcomes)
                          size = encoded_size(entry) + 1
                          if case_inventory_bytes + size <= CASE_INVENTORY_CAP:
                              case_inventory.append(entry)
                              case_inventory_bytes += size
                          else:
                              case_inventory_omitted += 1
                          skips = []
                          for detail in case:
                              kind = detail.tag.rsplit("}", 1)[-1]
                              if kind in ("failure", "error"):
                                  failure_details += kind == "failure"
                                  error_details += kind == "error"
                                  identity = bounded_diagnostic({
                                      "class": case.attrib.get("classname", ""),
                                      "test": case.attrib.get("name", ""), "kind": kind,
                                      "report": report.name
                                  }, 2048)
                                  if len(failed_cases) < 20:
                                      failed_cases.append({key: identity[key] for key in ("class", "test", "kind")})
                                  size = encoded_size(identity) + 1
                                  if failed_identity_bytes + size <= FAILED_IDENTITY_CAP:
                                      failed_identities.append(identity)
                                      failed_identity_bytes += size
                                  else:
                                      failed_identity_omitted += 1
                                  class_name = case.attrib.get("classname", "")
                                  if class_name not in sampled_classes:
                                      sampled_classes.add(class_name)
                                      sample = bounded_diagnostic({
                                          "class": class_name, "test": case.attrib.get("name", ""),
                                          "kind": kind, "report": report.name,
                                          "type": detail.attrib.get("type", ""),
                                          "message": detail.attrib.get("message", ""),
                                          "body": "".join(detail.itertext()).strip()
                                      }, FAILURE_CLASS_CAP)
                                      size = encoded_size(sample) + 1
                                      if failure_sample_bytes + size <= FAILURE_SAMPLE_CAP:
                                          failure_samples.append(sample)
                                          failure_sample_bytes += size
                                      else:
                                          failure_sample_omitted += 1
                              elif kind == "skipped":
                                  message = sanitize_diagnostic(detail.attrib.get("message", ""))
                                  detail_text = sanitize_diagnostic("".join(detail.itertext()).strip())
                                  skips.append("\n".join(part for part in (message, detail_text)
                                                         if part) or detail.attrib.get("type", "")
                                               or "No reason recorded in Surefire XML")
                          if skips:
                              skipped_count += 1
                              identity = {"class": case.attrib.get("classname", ""),
                                          "test": case.attrib.get("name", ""),
                                          "reason": "\n".join(skips), "report": report.name}
                              entry = {key: value[:1024] for key, value in identity.items()}
                              entry["truncated_fields"] = [key for key, value in identity.items()
                                                           if len(value) > 1024]
                              size = len(json.dumps(entry, ensure_ascii=True).encode("utf-8"))
                              if skipped_bytes + size <= SKIP_DETAIL_CAP:
                                  skipped_cases.append(entry)
                                  skipped_bytes += size
                              else:
                                  skipped_omitted += 1
                          else:
                              executed_tests += 1
                      parsed_reports += 1
                      retain_report(report, "parsed", report_counts, report_identities, report_outcomes)
              except Exception as error:
                  parse_issue = type(error).__name__ + ": " + sanitize_diagnostic(str(error))[:300]
                  retain_report(report, "error", report_counts, report_identities, report_outcomes, parse_issue)
                  for unparsed in reports[parsed_reports + 1:]:
                      retain_report(unparsed, "not-parsed", issue="collection stopped after the earlier report error")
              summary = {
                  "source_sha": sha,
                  "scope": scope,
                  "diagnostic_case_count": diagnostic_case_count,
                  "status": ("reports-parse-error" if parse_issue else
                             "reports-present" if reports else "no-surefire-reports"),
                  "report_count": len(reports), "parsed_report_count": parsed_reports,
                  **totals, "testcase_count": testcase_count, "executed_tests": executed_tests,
                  "failure_details": failure_details, "error_details": error_details,
                  "skipped_case_count": skipped_count, "skipped_cases": skipped_cases,
                  "skipped_details_bytes": skipped_bytes,
                  "skipped_details_cap_bytes": SKIP_DETAIL_CAP,
                  "skipped_details_omitted": skipped_omitted,
                  "first_failures": failed_cases, "parse_issue": parse_issue
              }
              summary["case_inventory"] = {
                  "state": "incomplete" if parse_issue else "no-reports" if not reports else
                           "complete-with-omissions" if case_inventory_omitted else "complete",
                  "order": "sorted report filename, then testcase order; not execution chronology",
                  "cases": case_inventory, "case_count": testcase_count,
                  "bytes": case_inventory_bytes, "cap_bytes": CASE_INVENTORY_CAP,
                  "omitted": case_inventory_omitted, "malformed_identity_count": malformed_identities,
                  "unique_identity_count": len(identity_counts),
                  "repeated_identity_count": sum(count > 1 for count in identity_counts.values()),
                  "duplicate_occurrence_count": sum(count - 1 for count in identity_counts.values()),
                  "identity_multiset_sha256": hashlib.sha256(json.dumps(
                      sorted(identity_counts.items()), ensure_ascii=True, separators=(",", ":")
                  ).encode("utf-8")).hexdigest(),
                  "multiset_sha256": hashlib.sha256(json.dumps(
                      sorted((identity, list(outcomes), count)
                             for (identity, outcomes), count in outcome_counts.items()),
                      ensure_ascii=True, separators=(",", ":")
                  ).encode("utf-8")).hexdigest(),
                  "identity_basis": "SHA256 of compact ASCII JSON [raw classname,raw testcase name]; "
                                    "multiset hashes sorted [identity_sha256,outcomes,multiplicity]; "
                                    "repeated names are observations, not validation failures"
              }
              summary["failure_capture"] = {
                  "state": "incomplete" if parse_issue else "no-reports" if not reports else
                           "complete-with-omissions" if failed_identity_omitted or failure_sample_omitted else "complete",
                  "order": "sorted report filename, then testcase order; not execution chronology",
                  "failed_identities": failed_identities, "identity_bytes": failed_identity_bytes,
                  "identity_cap_bytes": FAILED_IDENTITY_CAP, "identities_omitted": failed_identity_omitted,
                  "class_samples": failure_samples, "sample_bytes": failure_sample_bytes,
                  "sample_cap_bytes": FAILURE_SAMPLE_CAP, "per_class_cap_bytes": FAILURE_CLASS_CAP,
                  "sample_classes_omitted": failure_sample_omitted,
                  "issue": parse_issue
              }
              summary["report_inventory"] = {
                  "state": "incomplete" if parse_issue else "no-reports" if not reports else
                           "complete-with-omissions" if report_inventory_omitted else "complete",
                  "reports": report_inventory, "report_count": len(reports),
                  "bytes": report_inventory_bytes, "cap_bytes": REPORT_INVENTORY_CAP,
                  "omitted": report_inventory_omitted, "names_truncated": report_names_truncated,
                  "identity_basis": "stable raw report filename hash; per-report identity multiset uses "
                                    "the same raw classname/testcase identity hashes as case_inventory"
              }
              issues = report_validation_issues(summary)
              summary["validation"] = {"valid": not issues, "issues": issues}
              atomic_json(summary_path, summary)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                  output.write("## " + scope["label"] + " Surefire summary\n\n")
                  output.write(f"- Source: {sha}\n")
                  output.write(f"- Reports: {len(reports)}; parsed: {parsed_reports}\n")
                  output.write(
                      f"- Tests: {totals['tests']}; actually executed: {executed_tests}; "
                      f"failures: {totals['failures']}; errors: {totals['errors']}; "
                      f"skipped: {totals['skipped']}\n"
                  )
                  output.write("- Skipped class/test/reasons are retained in the bounded summary JSON; "
                               "skips remain unexecuted pending root scope reconciliation.\n")
                  if issues:
                      output.write("- Report validation issues: " + "; ".join(issues) + "\n")
                  if parse_issue:
                      output.write("- Surefire summary parse issue: " + parse_issue + "\n")
                  if failed_cases:
                      output.write("- First failing cases: " + ", ".join(
                          f"{case['class']}.{case['test']}" for case in failed_cases
                      ) + "\n")
              return summary

          # Preflight and externally persist ownership before creating the run-owned root.
          preflight_errors = []
          if scope_error:
              preflight_errors.append(scope_error)
          try:
              memory = memory_info()
          except Exception as error:
              memory = {"MemTotal": None, "MemAvailable": None}
              preflight_errors.append(type(error).__name__ + ": " + str(error)[:300])
          try:
              source_head = command_output(["git", "rev-parse", "HEAD"], cwd=workspace)
              clean = command_output(
                  ["git", "status", "--porcelain", "--untracked-files=all"], cwd=workspace
              ) == ""
          except Exception as error:
              source_head, clean = None, False
              preflight_errors.append(type(error).__name__ + ": " + str(error)[:300])
          target_absent = not os.path.lexists(target)
          if source_head != sha:
              preflight_errors.append("checkout revision does not match GITHUB_SHA")
          if not clean:
              preflight_errors.append("checkout is not clean")
          if not target_absent:
              preflight_errors.append("target existed before this run; ownership refused")
          if os.path.lexists(scratch):
              preflight_errors.append("run-owned scratch path already exists")
          try:
              disk_free_start = shutil.disk_usage(workspace).free
          except Exception as error:
              disk_free_start = None
              preflight_errors.append(type(error).__name__ + ": " + str(error)[:300])
          if disk_free_start is not None and disk_free_start < FREE_DISK_RESERVE:
              preflight_errors.append("free disk is below the 5 GiB reserve before launch")

          receipt = {
              "schema": "f555-java-resource-receipt/v1",
              "state": "preflight",
              "run_id": run_id,
              "attempt": attempt,
              "source_sha": sha,
              "scope": scope,
              "runner": {
                  "label": "ubuntu-24.04",
                  "memory_total_bytes": memory.get("MemTotal"),
                  "memory_available_at_start_bytes": memory.get("MemAvailable"),
                  "memory_source": "/proc/meminfo"
              },
              "budget": {
                  "inclusive_rss_cap_bytes": RSS_CAP,
                  "scratch_plus_target_cap_bytes": SCRATCH_TARGET_CAP,
                  "free_disk_reserve_bytes": FREE_DISK_RESERVE,
                  "sample_interval_seconds": SAMPLE_SECONDS,
                  "disk_sample_interval_seconds": DISK_SAMPLE_SECONDS,
                  "checkpoint_interval_seconds": CHECKPOINT_SECONDS,
                  "command_timeout_seconds": COMMAND_SECONDS,
                  "test_jvm_heap": "6g",
                  "maven_heap": "1g",
                  "postgres_container_limit": "2g",
                  "workers": 1,
                  "metaspace_cap": None
              },
              "source": {"head": source_head, "clean": clean},
              "target": {
                  "path": str(target),
                  "initially_absent": target_absent,
                  "ownership_basis": "clean ephemeral checkout; absent before the sole supervised Maven writer"
              },
              "postgres": {
                  "service_id": pg_service_id,
                  "image": "postgres:17.12",
                  "databases": ["gcsp_test_dev", "gcsp_test_running"],
                  "service_lifecycle": "GitHub Actions job service; ephemeral, not manually stopped by the supervisor"
              },
              "scratch": {
                  "path": str(scratch),
                  "state": "not-created",
                  "artifact_receipt": str(receipt_path)
              },
              "disk_free_start_bytes": disk_free_start,
              "preflight_errors": preflight_errors,
              "started_at_unix": started_wall,
              "finished_at_unix": None
          }

          for path in (receipt_path, summary_path, tail_path):
              if os.path.lexists(path):
                  raise RuntimeError("external run artifact path already exists")
          atomic_json(receipt_path, receipt)
          atomic_json(summary_path, {
              "source_sha": sha, "scope": scope, "status": "not-run", "report_count": 0,
              "tests": 0, "failures": 0, "errors": 0, "skipped": 0,
              "first_failures": [], "parse_issue": None
          })
          tail_path.write_bytes(b"")

          if preflight_errors:
              receipt["state"] = "preflight-failed"
              receipt["finished_at_unix"] = time.time()
              atomic_json(receipt_path, receipt)
              emit_progress({"state": receipt["state"], "errors": preflight_errors})
              sys.exit(1)

          interrupt_requested = False
          def interrupted(signum, frame):
              global interrupt_requested
              interrupt_requested = True

          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)

          scratch_identity = None
          target_identity = None
          process = None
          process_start = None
          reader = None
          reader_done = threading.Event()
          reader_lock = threading.Lock()
          reader_result = {"state": "not-started", "error": None, "bytes_read": 0}
          tail_chunks = collections.deque()
          tail_size = 0
          observed_groups = {}
          postgres_identity = None
          monitor = {
              "samples": 0,
              "peak_inclusive_rss_bytes": 0,
              "peak_elapsed_seconds": None,
              "peak_maven_processes": 0,
              "peak_postgres_processes": 0,
              "peak_scratch_plus_target_bytes": 0,
              "minimum_free_disk_bytes": disk_free_start,
              "checkpoints": [],
              "process_telemetry": {"samples": [], "bytes": 2,
                                    "cap_bytes": PROCESS_TELEMETRY_CAP, "omitted_samples": 0},
              "last_sample": None
          }
          status = "starting"
          failure = None
          abort_reason = None
          command_exit = None
          start = time.monotonic()
          last_checkpoint = 0
          last_disk_sample = 0
          cleanup = {
              "maven_owned_groups_absent": True,
              "reader_joined": True,
              "scratch_absent": False,
              "target_absent": False,
              "issues": []
          }

          def run_bounded(args, timeout=30):
              result = subprocess.run(args, capture_output=True, text=True, timeout=timeout)
              if result.returncode:
                  raise RuntimeError(Path(args[0]).name + " failed")
              return result.stdout.strip()

          def reader_snapshot():
              with reader_lock:
                  return {**reader_result, "done": reader_done.is_set()}

          def pump_output(pipe):
              global tail_size
              try:
                  while True:
                      chunk = pipe.read(8192)
                      if not chunk:
                          break
                      tail_chunks.append(chunk)
                      tail_size += len(chunk)
                      while tail_size > LOG_TAIL_CAP and tail_chunks:
                          excess = tail_size - LOG_TAIL_CAP
                          if len(tail_chunks[0]) <= excess:
                              tail_size -= len(tail_chunks.popleft())
                          else:
                              tail_chunks[0] = tail_chunks[0][excess:]
                              tail_size -= excess
                      with reader_lock:
                          reader_result["bytes_read"] += len(chunk)
              except Exception as error:
                  with reader_lock:
                      reader_result.update(state="error", error=type(error).__name__ + ": " + str(error)[:300])
              finally:
                  with reader_lock:
                      if reader_result["state"] != "error":
                          reader_result["state"] = "complete"
                      reader_done.set()

          def measure(rows):
              global observed_groups
              if not postgres_identity:
                  raise RuntimeError("PostgreSQL host PID identity was not established")
              pg_pid = postgres_identity["pid"]
              pg_root = rows.get(pg_pid)
              if not pg_root or pg_root["start"] != postgres_identity["start"]:
                  raise RuntimeError("PostgreSQL service host PID identity changed or disappeared")

              seeds = {
                  pid for group, members in observed_groups.items()
                  for pid, begin in members
                  if pid in rows and rows[pid]["start"] == begin and rows[pid]["pgid"] == group
              }
              seeds.update(
                  pid for pid, row in rows.items()
                  if row["pgid"] == process.pid and not row["stat"].startswith("Z")
              )
              if process.poll() is None and process.pid not in rows:
                  raise RuntimeError("supervised Maven process is missing from process snapshot")
              maven_pids = process_closure(seeds, rows)
              maven_pids = {pid for pid in maven_pids if not rows[pid]["stat"].startswith("Z")}
              if process.poll() is None and not maven_pids:
                  raise RuntimeError("supervised Maven process closure is empty")
              active_groups = {}
              for pid in maven_pids:
                  row = rows[pid]
                  active_groups.setdefault(row["pgid"], set()).add((pid, row["start"]))
              observed_groups = active_groups

              postgres_pids = process_closure({pg_pid}, rows)
              postgres_pids = {pid for pid in postgres_pids if not rows[pid]["stat"].startswith("Z")}
              pids = maven_pids | postgres_pids
              rss = sum(rows[pid]["rss"] for pid in pids)
              return rss, maven_pids, postgres_pids

          def stop_owned_groups():
              issues = []
              groups = dict(observed_groups)
              if process is not None:
                  groups.setdefault(process.pid, set()).add((process.pid, process_start))
              for sig, grace in ((signal.SIGTERM, 15), (signal.SIGKILL, 15)):
                  try:
                      rows = process_snapshot()
                  except Exception as error:
                      issues.append("cannot identify groups before signal: " + type(error).__name__)
                      break
                  pending = []
                  for group, known in groups.items():
                      live = live_group_rows(rows, group)
                      if not live:
                          continue
                      identity_proven = any((row["pid"], row["start"]) in known for row in live)
                      process_leader_proven = (
                          process is not None and group == process.pid and process.poll() is None
                      )
                      if not identity_proven and not process_leader_proven:
                          issues.append("refused signal to unverified process group " + str(group))
                          continue
                      try:
                          os.killpg(group, sig)
                          pending.append(group)
                      except ProcessLookupError:
                          pass
                      except PermissionError as error:
                          issues.append("signal denied for owned group " + str(group) + ": " + str(error)[:100])
                  deadline = time.monotonic() + grace
                  while pending and time.monotonic() < deadline:
                      try:
                          rows = process_snapshot()
                      except Exception:
                          break
                      pending = [group for group in pending if live_group_rows(rows, group)]
                      if pending:
                          time.sleep(0.5)
                  if not pending:
                      break
              if process is not None:
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      issues.append("Maven group leader did not join within 5 seconds")
              try:
                  rows = process_snapshot()
                  absent = all(not live_group_rows(rows, group) for group in groups)
              except Exception as error:
                  absent = False
                  issues.append("cannot verify process-group absence: " + type(error).__name__)
              return absent, issues

          try:
              scratch.mkdir(mode=0o700)
              stat = scratch.lstat()
              scratch_identity = (stat.st_dev, stat.st_ino)
              for name in ("maven-tmp", "java-tmp", "tmp"):
                  (scratch / name).mkdir(mode=0o700)
              receipt["scratch"].update(
                  state="active", device=stat.st_dev, inode=stat.st_ino
              )
              atomic_json(receipt_path, receipt)

              if not pg_service_id:
                  raise RuntimeError("GitHub PostgreSQL service id is missing")
              for database in ("gcsp_test_dev", "gcsp_test_running"):
                  run_bounded([
                      "docker", "exec", pg_service_id, "createdb", "-U", "gcsp",
                      "-O", "gcsp", database
                  ])
              postgres_version = run_bounded([
                  "docker", "exec", pg_service_id, "psql", "-U", "gcsp",
                  "-d", "postgres", "-Atc", "SHOW server_version"
              ])
              service_pid = int(run_bounded([
                  "docker", "inspect", "--format", "{{.State.Pid}}", pg_service_id
              ]))
              rows = process_snapshot()
              pg_row = rows.get(service_pid)
              if service_pid <= 0 or not pg_row:
                  raise RuntimeError("Docker service host PID is not visible in the runner process table")
              postgres_identity = {"pid": service_pid, "start": pg_row["start"]}
              receipt["postgres"].update(
                  host_pid=service_pid, process_start=pg_row["start"],
                  server_version=postgres_version
              )

              java_version = command_output(["java", "-version"])
              node_version = command_output(["node", "--version"])
              receipt["tool_versions"] = {
                  "java": java_version[:1000], "node": node_version[:200],
                  "postgres": postgres_version[:200]
              }
              for database, env_name in (
                  ("gcsp_test_dev", "GCSP_TEST_DATABASE_URL"),
                  ("gcsp_test_running", "GCSP_TEST_RUNNING_DATABASE_URL")
              ):
                  value = os.environ.get(env_name, "")
                  if database not in value or "user=gcsp" not in value or "127.0.0.1:5432" not in value:
                      raise RuntimeError(env_name + " does not match the isolated CI database")
              if not target_absent or os.path.lexists(target):
                  raise RuntimeError("Maven target ownership precondition changed before launch")

              child_env = os.environ.copy()
              child_env.update({
                  "MVNW_VERBOSE": "true",
                  "TMPDIR": str(scratch / "tmp"),
                  "TMP": str(scratch / "tmp"),
                  "TEMP": str(scratch / "tmp"),
                  "MAVEN_OPTS": (
                      "-Xms256m -Xmx1g -XX:+UseSerialGC -XX:ReservedCodeCacheSize=128m "
                      "-XX:ActiveProcessorCount=2 -Djava.io.tmpdir=" + str(scratch / "maven-tmp")
                  ),
                  "JAVA_TOOL_OPTIONS": (
                      "-Xms512m -Xmx6g -XX:+UseSerialGC -XX:ReservedCodeCacheSize=128m "
                      "-XX:ActiveProcessorCount=2 -Djava.io.tmpdir=" + str(scratch / "java-tmp")
                  )
              })
              if interrupt_requested:
                  raise RuntimeError("supervisor interrupted before Maven launch")
              process = subprocess.Popen(
                  command_argv,
                  cwd=str(api_dir), env=child_env,
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  start_new_session=True, bufsize=0
              )
              rows = process_snapshot()
              leader = rows.get(process.pid)
              if not leader or leader["pgid"] != process.pid:
                  raise RuntimeError("cannot establish the Maven process-group identity")
              process_start = leader["start"]
              cleanup["maven_owned_groups_absent"] = False
              observed_groups = {process.pid: {(process.pid, process_start)}}
              reader = threading.Thread(
                  target=pump_output, args=(process.stdout,), name="maven-output-tail", daemon=True
              )
              with reader_lock:
                  reader_result["state"] = "running"
              reader.start()
              receipt["maven"] = {
                  "argv": command_argv,
                  "pid": process.pid, "pgid": process.pid, "process_start": process_start,
                  "started_at_unix": time.time(), "status": "running"
              }
              atomic_json(receipt_path, receipt)
              status = "running"
              last_disk_sample = 0

              while process.poll() is None:
                  elapsed = time.monotonic() - start
                  collector = reader_snapshot()
                  if collector["state"] == "error":
                      abort_reason = "Maven output collector failed: " + collector["error"]
                      status = "collector-error"
                      break
                  if interrupt_requested:
                      abort_reason = "supervisor received a termination signal"
                      status = "interrupted"
                      break
                  try:
                      rows = process_snapshot()
                      rss, maven_pids, postgres_pids = measure(rows)
                      retain_process_sample(rows, maven_pids, postgres_pids, elapsed)
                      monitor["samples"] += 1
                      monitor["last_sample"] = {
                          "elapsed_seconds": int(elapsed), "inclusive_rss_bytes": rss,
                          "maven_process_count": len(maven_pids),
                          "postgres_process_count": len(postgres_pids)
                      }
                      if rss > monitor["peak_inclusive_rss_bytes"]:
                          monitor["peak_inclusive_rss_bytes"] = rss
                          monitor["peak_elapsed_seconds"] = int(elapsed)
                      monitor["peak_maven_processes"] = max(
                          monitor["peak_maven_processes"], len(maven_pids)
                      )
                      monitor["peak_postgres_processes"] = max(
                          monitor["peak_postgres_processes"], len(postgres_pids)
                      )
                      if elapsed - last_disk_sample >= DISK_SAMPLE_SECONDS:
                          allocated = allocated_bytes(scratch) + allocated_bytes(target)
                          free_disk = shutil.disk_usage(workspace).free
                          monitor["peak_scratch_plus_target_bytes"] = max(
                              monitor["peak_scratch_plus_target_bytes"], allocated
                          )
                          monitor["minimum_free_disk_bytes"] = min(
                              monitor["minimum_free_disk_bytes"] or free_disk, free_disk
                          )
                          last_disk_sample = elapsed
                          if allocated > SCRATCH_TARGET_CAP:
                              abort_reason = "scratch plus target exceeded 2 GiB"
                          elif free_disk < FREE_DISK_RESERVE:
                              abort_reason = "free disk fell below the 5 GiB reserve"
                      if rss > RSS_CAP:
                          abort_reason = "inclusive RSS exceeded the 12 GiB supervisor cap"
                      if elapsed >= COMMAND_SECONDS:
                          abort_reason = f"{COMMAND_SECONDS}-second {mode} command deadline reached"
                      if abort_reason:
                          status = "aborted-by-budget"
                          break
                      if elapsed - last_checkpoint >= CHECKPOINT_SECONDS:
                          monitor["checkpoints"].append(dict(monitor["last_sample"]))
                          last_checkpoint = elapsed
                          receipt["monitor"] = monitor
                          receipt["owned_process_groups"] = {
                              str(group): len(members) for group, members in observed_groups.items()
                          }
                          atomic_json(receipt_path, receipt)
                          emit_progress({"state": status, "elapsed_seconds": int(elapsed),
                                         "inclusive_rss_bytes": rss,
                                         "collector_bytes": reader_snapshot()["bytes_read"]})
                  except Exception as error:
                      abort_reason = "resource observation failed: " + type(error).__name__ + ": " + str(error)[:300]
                      status = "monitor-error"
                      break
                  time.sleep(SAMPLE_SECONDS)

              if abort_reason:
                  receipt["abort_reason"] = abort_reason
              else:
                  command_exit = process.wait()
                  status = "command-complete" if command_exit == 0 else "command-failed"
          except BaseException as error:
              if interrupt_requested:
                  status = "interrupted"
                  abort_reason = abort_reason or "supervisor received a termination signal"
              elif status in ("starting", "running"):
                  status = "supervisor-error"
              failure = type(error).__name__ + ": " + str(error)[:500]
          finally:
              if process is not None and command_exit is not None and not abort_reason:
                  try:
                      rows = process_snapshot()
                      final_rss, final_maven, final_postgres = measure(rows)
                      retain_process_sample(rows, final_maven, final_postgres, time.monotonic() - start)
                      monitor["samples"] += 1
                      monitor["last_sample"] = {
                          "elapsed_seconds": int(time.monotonic() - start),
                          "inclusive_rss_bytes": final_rss,
                          "maven_process_count": len(final_maven),
                          "postgres_process_count": len(final_postgres)
                      }
                      monitor["peak_inclusive_rss_bytes"] = max(
                          monitor["peak_inclusive_rss_bytes"], final_rss
                      )
                      if final_rss > RSS_CAP:
                          abort_reason = "final inclusive RSS exceeded the 12 GiB supervisor cap"
                          status = "aborted-by-budget"
                  except Exception as error:
                      cleanup["issues"].append(
                          "final RSS sample failed: " + type(error).__name__ + ": " + str(error)[:300]
                      )
              if interrupt_requested and abort_reason is None:
                  abort_reason = "supervisor received a termination signal"
                  status = "interrupted"
              if process is not None:
                  if process_start is None:
                      try:
                          rows = process_snapshot()
                          leader = rows.get(process.pid)
                          process_start = leader["start"] if leader else None
                          if process_start:
                              observed_groups.setdefault(process.pid, set()).add(
                                  (process.pid, process_start)
                              )
                      except Exception:
                          pass
                  absent, issues = stop_owned_groups()
                  cleanup["maven_owned_groups_absent"] = absent
                  cleanup["issues"].extend(issues)
                  if command_exit is None:
                      command_exit = process.poll()
              else:
                  cleanup["maven_owned_groups_absent"] = True
              if reader is not None:
                  reader.join(timeout=10)
                  cleanup["reader_joined"] = not reader.is_alive()
                  if reader.is_alive():
                      cleanup["issues"].append("Maven output reader did not join within 10 seconds")
              else:
                  cleanup["reader_joined"] = True
              collector = reader_snapshot()
              collector_issues = []
              if reader is None or not collector["done"] or collector["state"] != "complete":
                  collector_issues.append("Maven output collector did not complete successfully")
              if collector["error"] is not None:
                  collector_issues.append("Maven output collector error: " + collector["error"])
                  receipt["log_pump_issue"] = collector["error"]
              try:
                  if not cleanup["reader_joined"]:
                      raise RuntimeError("cannot persist a tail while its collector is still running")
                  tail_path.write_bytes(b"".join(tail_chunks))
              except Exception as error:
                  cleanup["issues"].append("log tail write failed: " + type(error).__name__)

              try:
                  summary = write_summary()
              except Exception as error:
                  summary = {
                      "source_sha": sha, "scope": scope, "status": "summary-error", "report_count": 0,
                      "tests": 0, "failures": 0, "errors": 0, "skipped": 0,
                      "first_failures": [],
                      "parse_issue": type(error).__name__ + ": " + sanitize_diagnostic(str(error))[:300]
                  }
                  try:
                      atomic_json(summary_path, summary)
                  except Exception:
                      cleanup["issues"].append("Surefire summary could not be persisted")

              try:
                  final_allocated = allocated_bytes(scratch) + allocated_bytes(target)
                  final_free = shutil.disk_usage(workspace).free
                  monitor["peak_scratch_plus_target_bytes"] = max(
                      monitor["peak_scratch_plus_target_bytes"], final_allocated
                  )
                  monitor["minimum_free_disk_bytes"] = min(
                      monitor["minimum_free_disk_bytes"] or final_free, final_free
                  )
                  if final_allocated > SCRATCH_TARGET_CAP and abort_reason is None:
                      abort_reason = "final scratch plus target exceeded 2 GiB"
                      status = "aborted-by-budget"
                  if final_free < FREE_DISK_RESERVE and abort_reason is None:
                      abort_reason = "final free disk was below the 5 GiB reserve"
                      status = "aborted-by-budget"
              except Exception as error:
                  cleanup["issues"].append(
                      "final disk sample failed: " + type(error).__name__ + ": " + str(error)[:300]
                  )
              can_remove = cleanup["maven_owned_groups_absent"] and cleanup["reader_joined"]
              if target_absent and can_remove and os.path.lexists(target):
                  try:
                      if target.is_symlink() or not target.is_dir():
                          raise RuntimeError("target was replaced by a non-directory or symlink")
                      target_stat = target.lstat()
                      target_identity = (target_stat.st_dev, target_stat.st_ino)
                      shutil.rmtree(target)
                  except Exception as error:
                      cleanup["issues"].append("target cleanup failed: " + type(error).__name__ + ": " + str(error)[:300])
              cleanup["target_absent"] = not os.path.lexists(target)
              if scratch_identity and can_remove:
                  try:
                      current = scratch.lstat()
                      if scratch.is_symlink() or (current.st_dev, current.st_ino) != scratch_identity:
                          raise RuntimeError("owned scratch identity changed")
                      shutil.rmtree(scratch)
                  except Exception as error:
                      cleanup["issues"].append("scratch cleanup failed: " + type(error).__name__ + ": " + str(error)[:300])
              cleanup["scratch_absent"] = not os.path.lexists(scratch)

              report_issues = report_validation_issues(summary)
              summary["validation"] = {"valid": not report_issues, "issues": report_issues}
              try:
                  atomic_json(summary_path, summary)
              except Exception as error:
                  cleanup["issues"].append("final Surefire summary write failed: " + type(error).__name__)
              success = (
                  status == "command-complete" and command_exit == 0 and
                  abort_reason is None and failure is None and
                  cleanup["maven_owned_groups_absent"] and cleanup["reader_joined"] and
                  cleanup["scratch_absent"] and cleanup["target_absent"] and
                  not cleanup["issues"] and not collector_issues and not report_issues
              )
              outcome_state = ("command-succeeded-reports-valid" if success else
                               "evidence-failed" if report_issues or collector_issues else status)
              receipt.update({
                  "state": outcome_state,
                  "supervision_status": status,
                  "command_outcome": {"maven_exit_code": command_exit,
                                      "state": "exit-zero" if command_exit == 0 else
                                               "exit-nonzero" if command_exit is not None else "not-observed"},
                  "outcome": {"success": success, "report_issues": report_issues,
                              "collector_issues": collector_issues},
                  "covering_disposition": {
                      "state": ("pending-root-scope-reconciliation" if mode == "canonical"
                                else "diagnostic-only-not-a-canonical-batch"),
                      "skipped_tests": summary.get("skipped", 0),
                      "note": "No skipped test becomes executed or waived; command/evidence success is not a covering decision."
                  },
                  "collector": collector,
                  "console": {**console_result, "cap_bytes": CONSOLE_CAP,
                              "mode": "nonblocking compact progress only; no raw Maven forwarding"},
                  "abort_reason": abort_reason,
                  "failure": failure,
                  "maven_exit_code": command_exit,
                  "elapsed_seconds": time.monotonic() - start,
                  "finished_at_unix": time.time(),
                  "monitor": monitor,
                  "owned_process_groups": {
                      str(group): len(members) for group, members in observed_groups.items()
                  },
                  "cleanup": {
                  **cleanup,
                  "postgres_service": "GitHub Actions owns teardown at ephemeral job end; not signalled by this supervisor"
              },
                  "target": {
                      "path": str(target), "initially_absent": target_absent,
                      "initial_head_clean": clean, "owned_from_absence": target_absent and clean,
                      "cleanup_device": target_identity[0] if target_identity else None,
                      "cleanup_inode": target_identity[1] if target_identity else None,
                      "absent_after_cleanup": cleanup["target_absent"]
                  },
                  "scratch": {
                      "path": str(scratch),
                      "device": scratch_identity[0] if scratch_identity else None,
                      "inode": scratch_identity[1] if scratch_identity else None,
                      "absent_after_cleanup": cleanup["scratch_absent"]
                  },
                  "surefire": summary
              })
              if process is not None:
                  receipt["maven"] = {
                      "argv": command_argv,
                      "pid": process.pid, "pgid": process.pid, "process_start": process_start,
                      "exit_code": command_exit, "status": status
                  }
              if postgres_identity:
                  receipt["postgres"]["host_pid"] = postgres_identity["pid"]
                  receipt["postgres"]["process_start"] = postgres_identity["start"]
              emit_progress({
                  "state": receipt["state"], "source_sha": sha, "maven_exit_code": command_exit,
                  "scope": scope,
                  "inclusive_peak_rss_bytes": monitor["peak_inclusive_rss_bytes"],
                  "receipt": str(receipt_path), "success": success,
                  "covering_disposition": receipt["covering_disposition"]["state"]
              })
              receipt["console"].update(console_result)
              atomic_json(receipt_path, receipt)

          sys.exit(0 if success else 1)
          PY

      - name: Retain the resource, Surefire, and bounded log evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f555-java-evidence-${{ github.event_name == 'push' && 'canonical' || inputs.mode || 'invalid' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/f555-java-${{ github.run_id }}-${{ github.run_attempt }}*-resource-receipt.json
            ${{ runner.temp }}/f555-java-${{ github.run_id }}-${{ github.run_attempt }}*-surefire-summary.json
            ${{ runner.temp }}/f555-java-${{ github.run_id }}-${{ github.run_attempt }}*-maven-tail.log
          if-no-files-found: warn
          retention-days: 7

  registered-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'browser'
    name: Registered 18-family browser batch
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - name: Check out the exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Check out the frozen Node reference separately
        uses: actions/checkout@v4
        with:
          ref: e44ed08a9674d8bf0fe6de2e7195ec3e2d775d38
          path: node-reference
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 24.22.3
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'

      - name: Set up Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '159.0.8154.6'
          install-dependencies: true

      - name: Install native PostgreSQL 17 and pinned npm
        shell: bash
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          # The registered helper owns initdb/start/stop; do not create a second service cluster.
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get install -y --no-install-recommends postgresql-17
          npm install --global npm@11.19.1 --no-audit --no-fund

      - name: Run the registered browser families serially
        timeout-minutes: 260
        working-directory: source
        env:
          GCSP_NODE_REFERENCE: ${{ github.workspace }}/node-reference
          GCSP_E2E_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GCSP_PG_BIN: /usr/lib/postgresql/17/bin
          PROOF_PSQL_BIN: /usr/lib/postgresql/17/bin/psql
          SCAFFOLDING_HARNESS: codex
        run: python3 -B scripts/gcsp/browser-ci-batch.py

      - name: Retain browser checkpoints, counts, skips and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registered-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gcsp-browser-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
