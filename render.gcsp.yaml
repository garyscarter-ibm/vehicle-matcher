# Render Blueprint for the GCSP demo environment, built from the gcsp-poc branch (HLD review Q1, Q2).
# Apply it as its own Blueprint with Blueprint Path render.gcsp.yaml; render.yaml stays the retail service's.
# Step-by-step: docs/gcsp/render-postgres-setup.md. Secrets are never committed here (sync: false).

databases:
  - name: gcsp-db
    plan: free             # expires 30 days after creation; one active free database per workspace (else 0.1c-256mb)
    region: frankfurt
    databaseName: gcsp
    user: gcsp
    ipAllowList:           # the pollers on Gary's and Russell's Macs connect from outside Render
      - source: 0.0.0.0/0
        description: everywhere

services:
  - type: web
    name: gcsp-api
    runtime: node
    plan: free             # sleeps after 15 min idle, about a minute to wake; starter avoids it
    region: frankfurt
    branch: gcsp-poc
    # Restore the code-pinned corpus at build time; runtime lookup stays offline.
    buildCommand: >-
      cd server && GCSP_FLEET_BUILD_EXPLICIT=1 npm install &&
      node scripts/fleet-artifacts.mjs restore
      --release 3b2a883cd85a2d0c3f89e36e14561d15996affec972e19bbba0d962cf79cce30
      --store "$PWD/data/gcsp/vehicle-evidence/fleet-source.v1"
      --cache "$PWD/data/gcsp/vehicle-evidence/fleet-artifacts.v1" --network download
    startCommand: cd server && npm start
    healthCheckPath: /health/vehicle-evidence
    autoDeployTrigger: commit
    buildFilter:           # API code, its pinned artifacts, and the GCSP pages it serves (GCSP_RUNTIME=1)
      paths:
        - server/**
        - scripts/gcsp/**
        - render.gcsp.yaml
        - gcsp-*.html
        - gcsp-*.css
        - blocks/**
        - assets/**
      ignoredPaths:
        - server/test/**
        - server/**/*.md
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GCSP_DATABASE_URL     # internal address; the backend applies its own migrations
        fromDatabase:
          name: gcsp-db
          property: connectionString
      - key: GCSP_OFFLINE          # no live retailer warmers at boot; retail fetches on first request
        value: "1"
      - key: GCSP_ALLOWED_ORIGINS  # must equal gcsp-site's address exactly; change here if Render adds a suffix
        value: https://gcsp-site.onrender.com
      - key: DEMO_ACCESS_KEY       # demo password for /api/* and the GCSP pages' one-time key form
        sync: false
      # FUCQ-180: the full GCSP runtime and its pages on this one origin (server/gcsp/host.js).
      - key: GCSP_RUNTIME
        value: "1"
      - key: GCSP_REPOSITORY_MODE  # memory for the demo (state resets on restart); postgres stays available
        value: memory
      - key: GCSP_PUBLIC_ORIGIN    # this service's own address, exactly; change here if Render adds a suffix
        value: https://gcsp-api.onrender.com
      - key: GCSP_PUBLIC_BASE_URL  # base for emailed offer links; the pages are served by this service
        value: https://gcsp-api.onrender.com
      - key: GCSP_MAIL_TRANSPORT   # brevo for real email; unset keeps mail captured in the outbox only
        sync: false
      - key: GCSP_MAIL_FROM
        sync: false
      - key: GCSP_MAIL_FROM_NAME
        sync: false
      - key: GCSP_MAIL_RECIPIENTS  # JSON map of demo principal to address
        sync: false
      - key: GCSP_BREVO_API_KEY
        sync: false

  - type: web
    name: gcsp-site
    runtime: static
    branch: gcsp-poc
    autoDeployTrigger: commit
    buildFilter:           # only what the build copies; keep in step with the cp list (render-blueprint.test.js checks)
      paths:
        - index.html
        - block.html
        - components.html
        - gcsp-employee.html
        - gcsp-employee.css
        - blocks/**
        - assets/**
    # Copies only what a browser needs (about 3 MB, not the fixtures) and points both pages at gcsp-api.
    buildCommand: >-
      test -n "$GCSP_API_URL" &&
      mkdir -p _site &&
      cp -R index.html block.html components.html gcsp-employee.html
      gcsp-employee.css blocks assets _site/ &&
      sed -i "s|https://bmw-matcher-api.onrender.com|$GCSP_API_URL|" _site/blocks/demo-launcher/boot.js &&
      sed -i "s|data-api=\"http://localhost:8787\"|data-api=\"$GCSP_API_URL\"|" _site/block.html &&
      grep -q "$GCSP_API_URL" _site/blocks/demo-launcher/boot.js &&
      grep -q "$GCSP_API_URL" _site/block.html
    staticPublishPath: _site
    # The live GCSP pages run on gcsp-api's origin with its session cookies; keep in step with server/gcsp/host.js.
    routes:
      - type: redirect
        source: /gcsp-presenter.html
        destination: https://gcsp-api.onrender.com/gcsp-presenter.html
      - type: redirect
        source: /gcsp-account.html
        destination: https://gcsp-api.onrender.com/gcsp-account.html
      - type: redirect
        source: /gcsp-greg.html
        destination: https://gcsp-api.onrender.com/gcsp-greg.html
      - type: redirect
        source: /gcsp-outbox.html
        destination: https://gcsp-api.onrender.com/gcsp-outbox.html
      - type: redirect
        source: /gcsp-brief-live.html
        destination: https://gcsp-api.onrender.com/gcsp-brief-live.html
      - type: redirect
        source: /gcsp-activity-live.html
        destination: https://gcsp-api.onrender.com/gcsp-activity-live.html
      - type: redirect
        source: /gcsp-order-progress-live.html
        destination: https://gcsp-api.onrender.com/gcsp-order-progress-live.html
      - type: redirect
        source: /gcsp-case-queue.html
        destination: https://gcsp-api.onrender.com/gcsp-case-queue.html
      - type: redirect
        source: /gcsp-help.html
        destination: https://gcsp-api.onrender.com/gcsp-help.html
      - type: redirect
        source: /gcsp-offer.html
        destination: https://gcsp-api.onrender.com/gcsp-offer.html
      - type: redirect
        source: /gcsp/offer
        destination: https://gcsp-api.onrender.com/gcsp/offer
    envVars:
      - key: GCSP_API_URL          # gcsp-api's public address; change here if Render adds a suffix
        value: https://gcsp-api.onrender.com
