# Render Blueprint for the GCSP demo environment, built from the gcsp-poc branch (HLD review Q1, Q2).
# Apply it as its own Blueprint with Blueprint Path render.gcsp.yaml; render.yaml stays the retail service's.
# Step-by-step: docs/gcsp/render-postgres-setup.md. Secrets are never committed here (sync: false).

databases:
  - name: gcsp-db
    plan: free             # expires 30 days after creation; one active free database per workspace (else 0.1c-256mb)
    region: frankfurt
    databaseName: gcsp
    user: gcsp
    ipAllowList:           # the pollers on Gary's and Russell's Macs connect from outside Render
      - source: 0.0.0.0/0
        description: everywhere

services:
  - type: web
    name: gcsp-api
    runtime: node
    plan: standard         # 2 GB: the hosted runtime peaks near 500 MB at start (FUCQ-190); a Blueprint sync applies this
    region: frankfurt
    branch: gcsp-poc
    # Restore the code-pinned corpus at build time; runtime lookup stays offline.
    buildCommand: >-
      cd server && GCSP_FLEET_BUILD_EXPLICIT=1 npm install &&
      node scripts/fleet-artifacts.mjs restore
      --release 3b2a883cd85a2d0c3f89e36e14561d15996affec972e19bbba0d962cf79cce30
      --store "$PWD/data/gcsp/vehicle-evidence/fleet-source.v1"
      --cache "$PWD/data/gcsp/vehicle-evidence/fleet-artifacts.v1" --network download
    startCommand: cd server && npm start
    healthCheckPath: /health/vehicle-evidence
    autoDeployTrigger: commit
    buildFilter:           # API code, its pinned artifacts, and the GCSP pages it serves (GCSP_RUNTIME=1)
      paths:
        - server/**
        - scripts/gcsp/**
        - render.gcsp.yaml
        - gcsp-*.html
        - gcsp-*.css
        - blocks/**
        - assets/**
      ignoredPaths:
        - server/test/**
        - server/**/*.md
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GCSP_DATABASE_URL     # internal address; the backend applies its own migrations
        fromDatabase:
          name: gcsp-db
          property: connectionString
      - key: GCSP_OFFLINE          # no live retailer warmers at boot; retail fetches on first request
        value: "1"
      - key: GCSP_ALLOWED_ORIGINS  # must equal gcsp-site's address exactly; change here if Render adds a suffix
        value: https://gcsp-site.onrender.com
      # FUCQ-180: the full GCSP runtime and its pages on this one origin (server/gcsp/host.js).
      - key: GCSP_RUNTIME
        value: "1"
      - key: GCSP_REPOSITORY_MODE  # account, preferences, sessions and active run survive restarts
        value: postgres
      - key: GCSP_COMPARISON_RESULT_FILE  # stored route comparison loaded at boot (FUCQ-288); relative to server/
        value: data/gcsp/comparison/process-only.json
      - key: GCSP_PUBLIC_ORIGIN    # this service's own address, exactly; change here if Render adds a suffix
        value: https://gcsp-api.onrender.com
      - key: GCSP_PUBLIC_BASE_URL  # base for emailed offer links; the pages are served by this service
        value: https://gcsp-api.onrender.com
      - key: GCSP_MAIL_TRANSPORT   # brevo for real email; unset keeps mail captured in the outbox only
        sync: false
      - key: GCSP_MAIL_FROM
        sync: false
      - key: GCSP_MAIL_FROM_NAME
        sync: false
      - key: GCSP_BREVO_API_KEY
        sync: false

  - type: web
    name: gcsp-site
    runtime: static
    branch: gcsp-poc
    autoDeployTrigger: commit
    buildFilter:           # only what the build copies; keep in step with the cp list (render-blueprint.test.js checks)
      paths:
        - index.html
        - block.html
        - components.html
        - gcsp-employee.html
        - gcsp-employee.css
        - blocks/**
        - assets/**
    # Copies only what a browser needs (about 3 MB, not the fixtures) and points both pages at gcsp-api.
    buildCommand: >-
      test -n "$GCSP_API_URL" &&
      mkdir -p _site &&
      cp -R index.html block.html components.html gcsp-employee.html
      gcsp-employee.css blocks assets _site/ &&
      sed -i "s|https://bmw-matcher-api.onrender.com|$GCSP_API_URL|" _site/blocks/demo-launcher/boot.js &&
      sed -i "s|data-api=\"http://localhost:8787\"|data-api=\"$GCSP_API_URL\"|" _site/block.html &&
      grep -q "$GCSP_API_URL" _site/blocks/demo-launcher/boot.js &&
      grep -q "$GCSP_API_URL" _site/block.html
    staticPublishPath: _site
    # The live GCSP pages run on gcsp-api's origin with its session cookies; keep in step with server/gcsp/host.js.
    routes:
      - type: redirect
        source: /gcsp/login
        destination: https://gcsp-api.onrender.com/gcsp/login
      - type: redirect
        source: /gcsp-login.html
        destination: https://gcsp-api.onrender.com/gcsp-login.html
      - type: redirect
        source: /gcsp-presenter.html
        destination: https://gcsp-api.onrender.com/gcsp-presenter.html
      - type: redirect
        source: /gcsp-account.html
        destination: https://gcsp-api.onrender.com/gcsp-account.html
      - type: redirect
        source: /gcsp-greg.html
        destination: https://gcsp-api.onrender.com/gcsp-greg.html
      - type: redirect
        source: /gcsp-outbox.html
        destination: https://gcsp-api.onrender.com/gcsp-outbox.html
      - type: redirect
        source: /gcsp-brief-live.html
        destination: https://gcsp-api.onrender.com/gcsp-brief-live.html
      - type: redirect
        source: /gcsp-activity-live.html
        destination: https://gcsp-api.onrender.com/gcsp-activity-live.html
      - type: redirect
        source: /gcsp-order-progress-live.html
        destination: https://gcsp-api.onrender.com/gcsp-order-progress-live.html
      - type: redirect
        source: /gcsp-case-queue.html
        destination: https://gcsp-api.onrender.com/gcsp-case-queue.html
      - type: redirect
        source: /gcsp-help.html
        destination: https://gcsp-api.onrender.com/gcsp-help.html
      - type: redirect
        source: /gcsp-offer.html
        destination: https://gcsp-api.onrender.com/gcsp-offer.html
      - type: redirect
        source: /gcsp/offer
        destination: https://gcsp-api.onrender.com/gcsp/offer
    envVars:
      - key: GCSP_API_URL          # gcsp-api's public address; change here if Render adds a suffix
        value: https://gcsp-api.onrender.com

  # Independent migration checkpoint; the existing gcsp-poc services above stay supported.
  - type: web
    name: gcsp-java-api
    runtime: docker
    # plan: deliberately unset; no tier is selected. Measured idle RSS is about 115 MB.
    region: frankfurt
    branch: gcsp-poc-dev
    dockerfilePath: ./services/gcsp-api/Dockerfile
    dockerContext: ./services/gcsp-api
    healthCheckPath: /q/health/ready
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - services/gcsp-api/**
      ignoredPaths:
        - services/gcsp-api/README.md
        - services/gcsp-api/render-service.proposed.yaml
    envVars:
      # PORT is injected by Render; the service binds to it.
      - key: GCSP_IDENTITY_PROVIDER
        value: none            # refuses every context call until FUCQ-455 adds oidc
      - key: GCSP_ALLOWED_ORIGINS
        sync: false            # exact static-site origin(s), comma separated (FUCQ-435)
      - key: GCSP_SHUTDOWN_TIMEOUT
        value: 10s
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75

  - type: web
    name: gcsp-angular-dev
    runtime: static
    branch: gcsp-poc-dev
    autoDeployTrigger: commit
    buildCommand: >-
      npm install --global npm@11.19.1 &&
      npm ci --prefix apps/gcsp-web &&
      npm run gcsp:compile &&
      npm run gcsp:assemble --
      --browser apps/gcsp-web/dist/gcsp-web/browser
      --output _gcsp-site --environment deployed --revision "$RENDER_GIT_COMMIT"
    staticPublishPath: _gcsp-site
    buildFilter:
      paths:
        - apps/gcsp-web/**
        - blocks/gcsp/shell/**
        - designs/**
        - scripts/build-gcsp-static.mjs
        - scripts/assemble-site.mjs
        - scripts/gcsp-runtime-config.mjs
        - _config/gcsp-runtime-config.schema.json
        - package.json
        - package-lock.json
        - render.gcsp.yaml
      ignoredPaths:
        - apps/gcsp-web/**/*.spec.ts
        - apps/gcsp-web/**/*.md
        - apps/gcsp-web/vitest.config.ts
        - apps/gcsp-web/tsconfig.spec.json
    # Exact paths avoid returning HTML for unknown/missing assets. Dynamic offers await FUCQ-437.
    routes:
      - type: redirect
        source: /gcsp
        destination: /gcsp/
      - type: rewrite
        source: /gcsp/
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/sign-in
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/auth/callback
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/account
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/preferences
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/stock
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/manual/review
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/manual/summary
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/activity
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/orders
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/help
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/greg
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/greg/cases
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/presenter
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/presenter/outbox
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/components
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/access-denied
        destination: /gcsp/index.html
      - type: rewrite
        source: /gcsp/unavailable
        destination: /gcsp/index.html
    headers:
      - path: /gcsp/*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - path: /gcsp/*
        name: Referrer-Policy
        value: no-referrer
      - path: /gcsp/*
        name: X-Content-Type-Options
        value: nosniff
      - path: /gcsp
        name: Cache-Control
        value: no-store
      - path: /gcsp/index.html
        name: Cache-Control
        value: no-store
      - path: /gcsp/runtime-config.json
        name: Cache-Control
        value: no-store
      - path: /gcsp/
        name: Cache-Control
        value: no-store
      - path: /gcsp/sign-in
        name: Cache-Control
        value: no-store
      - path: /gcsp/auth/callback
        name: Cache-Control
        value: no-store
      - path: /gcsp/account
        name: Cache-Control
        value: no-store
      - path: /gcsp/preferences
        name: Cache-Control
        value: no-store
      - path: /gcsp/stock
        name: Cache-Control
        value: no-store
      - path: /gcsp/manual/review
        name: Cache-Control
        value: no-store
      - path: /gcsp/manual/summary
        name: Cache-Control
        value: no-store
      - path: /gcsp/activity
        name: Cache-Control
        value: no-store
      - path: /gcsp/orders
        name: Cache-Control
        value: no-store
      - path: /gcsp/help
        name: Cache-Control
        value: no-store
      - path: /gcsp/greg
        name: Cache-Control
        value: no-store
      - path: /gcsp/greg/cases
        name: Cache-Control
        value: no-store
      - path: /gcsp/presenter
        name: Cache-Control
        value: no-store
      - path: /gcsp/presenter/outbox
        name: Cache-Control
        value: no-store
      - path: /gcsp/components
        name: Cache-Control
        value: no-store
      - path: /gcsp/access-denied
        name: Cache-Control
        value: no-store
      - path: /gcsp/unavailable
        name: Cache-Control
        value: no-store
      - path: /gcsp/*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /gcsp/*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /gcsp/media/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /gcsp/assets/*
        name: Cache-Control
        value: no-cache
      - path: /gcsp/static-manifest.json
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: "24.22.3"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: GCSP_PUBLIC_ENVIRONMENT_ID
        sync: false
      - key: GCSP_PUBLIC_API_BASE_URL
        sync: false
      - key: GCSP_PUBLIC_OIDC_AUTHORITY
        sync: false
      - key: GCSP_PUBLIC_OIDC_CLIENT_ID
        sync: false
      - key: GCSP_PUBLIC_OIDC_SCOPE
        sync: false
      - key: GCSP_PUBLIC_OIDC_REDIRECT_URI
        sync: false
      - key: GCSP_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI
        sync: false
