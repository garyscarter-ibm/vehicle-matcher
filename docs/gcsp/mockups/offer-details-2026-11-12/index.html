<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your offer · Spacing and details options</title>
  <link rel="stylesheet" href="../../../../blocks/gcsp/shell/gcsp-shell.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="gcsp study">
  <header class="study-head"><h1>YOUR OFFER · REFINEMENTS</h1><p>Title spacing and car details</p></header>
  <main>
    <section aria-labelledby="title-heading">
      <h2 id="title-heading">Give the title and finishes their own space</h2>
      <div class="pair title-pair">
        <figure><figcaption>Current</figcaption>
          <div class="identity current">
            <p class="context">Your buddy found a car for you</p>
            <h3>BMW X2 M35i in Black Sapphire</h3>
            <div class="finishes">
              <p class="finish"><i aria-hidden="true"></i><span>Black Sapphire</span></p>
              <p class="finish"><i aria-hidden="true"></i><span>M Alcantara Veganza combination Black contrast stitching</span></p>
            </div>
          </div>
        </figure>
        <figure><figcaption>Proposed · same font size, more breathing room</figcaption>
          <div class="identity proposed">
            <div class="identity-title"><p class="context">Your buddy found a car for you</p><h3>BMW X2 M35i in Black Sapphire</h3></div>
            <div class="finishes">
              <div class="finish"><i aria-hidden="true"></i><div><p class="finish-label">Paint</p><p>Black Sapphire</p></div></div>
              <div class="finish"><i aria-hidden="true"></i><div><p class="finish-label">Upholstery</p><p>M Alcantara Veganza combination Black contrast stitching</p></div></div>
            </div>
          </div>
        </figure>
      </div>
    </section>
    <section class="details-study" aria-labelledby="details-heading">
      <h2 id="details-heading">Replace the loose two-column bar</h2>
      <div class="pair">
        <figure><figcaption>A · Stacked expanders</figcaption>
          <div class="detail-example">
            <div class="overview"><div><span>Body style</span><strong>SUV</strong></div><div><span>Fuel</span><strong>Petrol</strong></div><div><span>Transmission</span><strong>Automatic</strong></div></div>
            <div class="accordion-row"><strong>Full specification</strong><span aria-hidden="true">⌄</span></div>
            <div class="accordion-row"><strong>Selected equipment <span class="count">57</span></strong><span aria-hidden="true">⌄</span></div>
          </div>
          <p class="option-note">Clearer rows. Details still expand in the page.</p>
        </figure>
        <figure><figcaption>B · One entry + drawer <span class="recommendation">Recommended</span></figcaption>
          <div class="detail-example">
            <div class="overview"><div><span>Body style</span><strong>SUV</strong></div><div><span>Fuel</span><strong>Petrol</strong></div><div><span>Transmission</span><strong>Automatic</strong></div></div>
            <a class="details-entry" href="drawer.html"><span><strong>View car details</strong><small>Full specification · 57 selected equipment items</small></span><span class="entry-arrow" aria-hidden="true">→</span></a>
          </div>
          <p class="option-note">Keeps the offer focused. Uses the drawer pattern from Your cars.</p>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
